            if (state.carStage === 'DRIVING_TO_V') {
                state.animProgress += dt * 1.8;
                const t = easeInOutCubic(Math.min(state.animProgress, 1));

                let startX, startY;
                if (state.activeCornerIndex === 0) {
                    const s = getStartPointInfo();
                    startX = s.x;
                    startY = s.y;
                } else {
                    const prevV = corners[state.activeCornerIndex - 1].vertex;
                    startX = prevV.x;
                    startY = prevV.y;
                }

                state.carX = startX + (c.vertex.x - startX) * t;
                state.carY = startY + (c.vertex.y - startY) * t;
                state.carAngle = c.inAngle;

                if (state.animProgress >= 1) {
                    if (state.steeringMode === 'AUTO') {
                        state.turnStartDeg = 0;
                        state.turnTargetDeg = c.displayDeg;
                        state.enteredAngleDeg = c.displayDeg;
                        state.isTargetAngleCorrect = true;
                        state.carStage = 'TURNING';
                        state.animProgress = 0;
                    } else {
                        state.carStage = 'WAITING_INPUT';
                        state.animProgress = 0;
                        const inputEl = document.getElementById('angleInput');
                        inputEl.value = '';
                        inputEl.focus();
                    }
                    updateDashboardUI();
                }
            } else if (state.carStage === 'TURNING') {
                state.animProgress += dt * 1.5;
                const t = easeInOutCubic(Math.min(state.animProgress, 1));

                const currDeg = state.turnStartDeg + (state.turnTargetDeg - state.turnStartDeg) * t;
                state.currentCornerTurnDeg = currDeg;
                state.cumulativeTurnDeg = prevSum + currDeg;
                state.carAngle = c.inAngle + (currDeg * Math.PI) / 180;

                updateDashboardUI();

                if (state.animProgress >= 1) {
                    state.currentCornerTurnDeg = state.turnTargetDeg;
                    state.cumulativeTurnDeg = prevSum + state.turnTargetDeg;

                    if (state.isTargetAngleCorrect) {
                        state.carAngle = c.outAngle;
                        state.completedCorners = state.activeCornerIndex + 1;
                        state.carStage = 'TURN_CORRECT';
                    } else {
                        state.carStage = 'TURN_WRONG';
                    }
                    updateDashboardUI();
                }
            } else if (state.carStage === 'DRIVING_OFF') {
                state.animProgress += dt * 1.4;
                const t = easeInOutCubic(Math.min(state.animProgress, 1));
                state.offTrackDistance = t * 145 * S;

                const wrongRad = c.inAngle + (state.currentCornerTurnDeg * Math.PI) / 180;
                state.carX = c.vertex.x + state.offTrackDistance * Math.cos(wrongRad);
                state.carY = c.vertex.y + state.offTrackDistance * Math.sin(wrongRad);
                state.carAngle = wrongRad;

                if (state.animProgress >= 1) {
                    state.carStage = 'OFF_TRACK_STOP';
                    updateDashboardUI();
                }
            } else if (state.carStage === 'RETURNING_HOME') {
                state.animProgress += dt * 1.9;
                const t = easeInOutCubic(Math.min(state.animProgress, 1));
                const s = getStartPointInfo();
                const lastCorner = corners[n - 1];

                state.carX = lastCorner.vertex.x + (s.x - lastCorner.vertex.x) * t;
                state.carY = lastCorner.vertex.y + (s.y - lastCorner.vertex.y) * t;
                state.carAngle = s.angle;

                if (state.animProgress >= 1) {
                    state.carStage = 'LAP_COMPLETE';
                    state.cumulativeTurnDeg = getTurnTarget();
                    updateDashboardUI();
                }
            }
        }

        // ============================================================================
        // 8. CANVAS RENDERER
        // ============================================================================
        function renderCanvasScene() {
            const { w, h } = getCanvasSize();
            ctx.clearRect(0, 0, w, h);
            if (state.vertices.length === 0) return;

            const { corners, centroid } = computePolygonGeometry();
            const gather = state.gatherRatio;
            const polyAlpha = Math.max(0.18, 1 - gather * 0.72);
            const wedgeRadius = Math.min(w, h) * 0.13;
            // 휴대폰처럼 작은 화면에서는 각도 숫자를 조금 작게
            labelK = Math.max(0.68, Math.min(1, Math.min(w, h) / 650));

            // 1. Polygon Track
            ctx.save();
            ctx.beginPath();
            state.vertices.forEach((v, idx) => idx === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y));
            ctx.closePath();
            ctx.fillStyle = `rgba(255, 255, 255, ${0.78 * polyAlpha})`;
            ctx.fill();
            ctx.lineWidth = 8 * S;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = `rgba(226, 232, 240, ${polyAlpha})`;
            ctx.stroke();
            ctx.lineWidth = 3.5 * S;
            ctx.strokeStyle = `rgba(30, 41, 59, ${polyAlpha})`;
            ctx.stroke();
            ctx.restore();

            // 2. Start Line Marker
            if (gather < 0.5) drawStartFlag(getStartPointInfo(), 1 - gather * 2);

            // 3. Interior Angles (숫자는 외각을 그린 뒤에 써서 가려지지 않게)
            const interiorLabels = (state.showInteriorAngles && gather < 0.45) ? drawInteriorAngles(corners, 1 - gather * 2.2) : [];

            // 4. Exterior Angle Wedges + Extension Lines
            // 별다각형을 모을 때는 바퀴마다 반지름을 키워 나선(겹 원)처럼 쌓기 위해 각 꼭짓점 앞까지의 누적 회전각을 구함
            const cumBefore = [];
            corners.reduce((acc, c) => { cumBefore.push(acc); return acc + c.exactDeg; }, 0);
            const lapRadius = lap => wedgeRadius * (1 + 0.55 * lap);
            const target = getTurnTarget();

            // 오른쪽(+)으로 돈 외각을 먼저, 왼쪽(−)으로 돈 외각을 위에 그림 (모았을 때 상쇄되는 모습이 보이도록)
            const drawOrder = [...corners.filter(c => c.displayDeg >= 0), ...corners.filter(c => c.displayDeg < 0)];
            drawOrder.forEach(c => {
                const idx = c.index;
                const isCompleted = idx < state.completedCorners || state.showAllAnglesAlways || gather > 0.02;
                const isActiveCorner = idx === state.activeCornerIndex && (
                    state.carStage === 'WAITING_INPUT' || state.carStage === 'TURNING' ||
                    state.carStage === 'TURN_WRONG' || state.carStage === 'DRIVING_OFF' || state.carStage === 'OFF_TRACK_STOP'
                );
                if (!isCompleted && !isActiveCorner) return;

                const ox = c.vertex.x + (centroid.x - c.vertex.x) * gather;
                const oy = c.vertex.y + (centroid.y - c.vertex.y) * gather;

                // 4A. 연장선 ("원래 가던 길") — 버튼으로 켰을 때만
                if (state.showExtension) {
                const extLength = wedgeRadius + 42 * S;
                const ex = ox + extLength * Math.cos(c.inAngle);
                const ey = oy + extLength * Math.sin(c.inAngle);
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([6 * S, 5 * S]);
                ctx.moveTo(ox, oy);
                ctx.lineTo(ex, ey);
                ctx.lineWidth = 3 * S;
                ctx.strokeStyle = gather > 0.5 ? 'rgba(255, 255, 255, 0.8)' : '#10B981';
                ctx.stroke();
                ctx.setLineDash([]);
                if (gather < 0.4) drawArcArrowhead(ex, ey, c.inAngle, '#10B981');
                ctx.restore();
                }

                // 4B. 외각 부채꼴 (+ 시계 방향, − 반시계 방향)
                let sweepRad = 0, isWrongWedge = false, displayDegNum = c.displayDeg;
                if (isCompleted) {
                    sweepRad = c.turnRad;
                } else if (isActiveCorner) {
                    sweepRad = (state.currentCornerTurnDeg * Math.PI) / 180;
                    displayDegNum = Math.round(state.currentCornerTurnDeg);
                    if (!state.isTargetAngleCorrect && state.carStage !== 'WAITING_INPUT') isWrongWedge = true;
                }
                const neg = sweepRad < 0;

                if (Math.abs(sweepRad) > 0.01) {
                    const label = `${displayDegNum < 0 ? '−' : ''}${Math.abs(displayDegNum)}°`;
                    const px = (gather > 0.5 ? 18 : 22) * S * labelK;
                    const fit = fitLabelInWedge(label, px, Math.abs(sweepRad), wedgeRadius, gather > 0.5 ? 1 : 1.6, gather > 0.5 ? 0.62 : 0.5);
                    const r = state.showExteriorNumbers ? fit.r : wedgeRadius;
                    const solid = (state.showExteriorNumbers || gather > 0.3) && !neg;
                    const strokeCol = isWrongWedge ? '#BE123C' : c.color.hex;

                    // 바퀴 경계(360°의 배수)에서 잘라 여러 조각으로 그림. 모았을 때 조각마다 바퀴에 맞는 반지름
                    const startCum = cumBefore[idx];
                    const segs = [];
                    if (!neg && !isWrongWedge && isCompleted) {
                        let a = startCum, end = startCum + c.exactDeg;
                        while (a < end - 0.01) {
                            const lap = Math.floor(a / 360 + 1e-9);
                            const e = Math.min(end, (lap + 1) * 360);
                            segs.push({ a0: (a - startCum) * Math.PI / 180, a1: (e - startCum) * Math.PI / 180, lap: Math.max(0, lap) });
                            a = e;
                        }
                    } else {
                        segs.push({ a0: 0, a1: sweepRad, lap: Math.max(0, Math.floor(startCum / 360 + 1e-9)) });
                    }

                    ctx.save();
                    const multiLap = state.lapCount > 1;
                    segs.forEach(sg => {
                        const rr = r + (lapRadius(sg.lap) - wedgeRadius) * gather * (multiLap ? 1 : 0);
                        // 두 번째 바퀴부터는 안쪽 바퀴를 가리지 않도록 고리 모양으로 (모을수록 안쪽 반지름이 커짐)
                        const rIn = multiLap && sg.lap > 0 ? (r + (lapRadius(sg.lap - 1) - wedgeRadius) * gather) * gather : 0;
                        sg.r = rr;
                        sg.rIn = rIn;
                        const a0 = c.inAngle + sg.a0, a1 = c.inAngle + sg.a1, ccw = sg.a1 < sg.a0;
                        ctx.beginPath();
                        if (rIn > 1) {
                            ctx.arc(ox, oy, rr, a0, a1, ccw);
                            ctx.arc(ox, oy, rIn, a1, a0, !ccw);
                        } else {
                            ctx.moveTo(ox, oy);
                            ctx.arc(ox, oy, rr, a0, a1, ccw);
                        }
                        ctx.closePath();
                        if (isWrongWedge) {
                            ctx.fillStyle = (state.showExteriorNumbers || gather > 0.3) ? 'rgba(225, 29, 72, 0.85)' : 'rgba(244, 63, 94, 0.25)';
                        } else if (neg) {
                            // 왼쪽으로 돈 외각: 연한 색 + 점선 (모으면 앞 외각을 지우는 모습)
                            ctx.fillStyle = gather > 0.3 ? 'rgba(255, 255, 255, 0.82)' : c.color.fill;
                        } else {
                            ctx.fillStyle = solid ? c.color.solidFill : c.color.fill;
                        }
                        ctx.fill();
                        ctx.lineWidth = (neg ? 3 : 2.2) * S;
                        ctx.setLineDash(neg ? [6 * S, 4 * S] : []);
                        ctx.strokeStyle = neg || !solid || isWrongWedge ? strokeCol : '#FFFFFF';
                        ctx.stroke();
                        ctx.setLineDash([]);
                    });

                    // 호 끝 화살표 (도는 방향)
                    if (gather < 0.7 && Math.abs(sweepRad) > 0.2) {
                        const arrowAng = c.inAngle + sweepRad;
                        const rr = segs[segs.length - 1].r;
                        drawArcArrowhead(ox + rr * Math.cos(arrowAng), oy + rr * Math.sin(arrowAng), arrowAng + (neg ? -Math.PI / 2 : Math.PI / 2), strokeCol);
                    }

                    // 부채꼴 안 숫자 (가장 큰 조각에)
                    if (state.showExteriorNumbers && !(gather > 0.5 && Math.abs(sweepRad) < 0.3)) {
                        const big = segs.reduce((m, sg) => Math.abs(sg.a1 - sg.a0) > Math.abs(m.a1 - m.a0) ? sg : m, segs[0]);
                        const midAng = c.inAngle + (big.a0 + big.a1) / 2;
                        const d = big.rIn > 1 ? (big.rIn + big.r) / 2 : fit.d * (big.r / r);
                        const inside = fit.inside && !neg;
                        drawWedgeText(label, ox + d * Math.cos(midAng), oy + d * Math.sin(midAng), px, inside ? undefined : (isWrongWedge ? '#BE123C' : c.color.badgeText));
                    }
                    ctx.restore();
                }

                // 4C. 잘못 돌았을 때: 빨간 이탈 경로
                if (isActiveCorner && isWrongWedge && gather === 0) {
                    const wrongAngleRad = c.inAngle + sweepRad;
                    const rayLen = 175 * S;
                    const wx = ox + rayLen * Math.cos(wrongAngleRad);
                    const wy = oy + rayLen * Math.sin(wrongAngleRad);
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([8 * S, 6 * S]);
                    ctx.moveTo(ox, oy);
                    ctx.lineTo(wx, wy);
                    ctx.lineWidth = 3.5 * S;
                    ctx.strokeStyle = '#E11D48';
                    ctx.stroke();
                    ctx.setLineDash([]);
                    drawArcArrowhead(wx, wy, wrongAngleRad, '#E11D48');
                    ctx.restore();
                }
            });

            interiorLabels.forEach(draw => draw());

            // 5. 모은 외각이 이루는 360° 원 (별은 바퀴 수만큼 겹 원)
            if (gather > 0.85) {
                const ringAlpha = (gather - 0.85) / 0.15;
                ctx.save();
                const laps = Math.max(1, state.lapCount);
                ctx.lineWidth = 3.5 * S;
                ctx.strokeStyle = `rgba(15, 23, 42, ${ringAlpha})`;
                ctx.setLineDash([8 * S, 6 * S]);
                ctx.beginPath();
                ctx.arc(centroid.x, centroid.y, (laps > 1 ? lapRadius(laps - 1) : wedgeRadius) + 10 * S, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = `rgba(15, 23, 42, ${ringAlpha})`;
                ctx.beginPath();
                ctx.arc(centroid.x, centroid.y, 32 * S, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 255, 255, ${ringAlpha})`;
                ctx.font = monoFont(18);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${target}°`, centroid.x, centroid.y + 1);
                if (laps > 1) {
                    // 원 바깥에 "360° × 2바퀴" 안내
                    const ty = centroid.y + lapRadius(laps - 1) + 40 * S;
                    ctx.font = monoFont(20);
                    ctx.lineWidth = 5 * S;
                    ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
                    ctx.strokeText(`360° × ${laps}바퀴 = ${target}°`, centroid.x, ty);
                    ctx.fillStyle = `rgba(15, 23, 42, ${ringAlpha})`;
                    ctx.fillText(`360° × ${laps}바퀴 = ${target}°`, centroid.x, ty);
                }
                ctx.restore();
            }

            // 6. 꼭짓점 (A, B, C...)
            corners.forEach((c, idx) => {
                const isHovered = state.hoveredVertexIndex === idx || state.draggingVertexIndex === idx;
                const r = (isHovered ? 15 : 13) * S;
                ctx.save();
                ctx.globalAlpha = 1 - gather * 0.6; // 외각을 모으면 꼭짓점은 흐리게
                if (isHovered) {
                    ctx.beginPath();
                    ctx.arc(c.vertex.x, c.vertex.y, 22 * S, 0, Math.PI * 2);
                    ctx.fillStyle = `${c.color.hex}28`;
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(c.vertex.x, c.vertex.y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.lineWidth = 3.5 * S;
                ctx.strokeStyle = c.color.hex;
                ctx.stroke();
                ctx.font = monoFont(13);
                ctx.fillStyle = '#0F172A';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c.label, c.vertex.x, c.vertex.y + 0.5);
                ctx.restore();
            });

            // 7. 자동차
            if (gather < 0.65) {
                const isOffTrack = state.carStage === 'DRIVING_OFF' || state.carStage === 'OFF_TRACK_STOP';
                drawTopDownCar(state.carX, state.carY, state.carAngle, 1 - gather * 1.4, isOffTrack);
            }
        }

        // 부채꼴 안에 글자가 들어갈 위치와 필요한 반지름
        // (글자 상자를 감싸는 원이 부채꼴 안, 꼭짓점 원 바깥에 놓이도록)
        function fitLabelInWedge(text, px, sweepRad, baseR, maxScale, minFrac) {
            ctx.save();
            ctx.font = `800 ${Math.round(px)}px "JetBrains Mono", Consolas, monospace`;
            const tw = ctx.measureText(text).width;
            ctx.restore();
            const rt = Math.hypot(tw / 2, px / 2) + 2 * S;
            maxScale = Math.max(1, maxScale);
            const halfSin = Math.sin(Math.min(sweepRad, Math.PI * 0.999) / 2);
            const d = Math.max(baseR * minFrac, 20 * S + rt, rt / Math.max(halfSin, 0.01));
            const needR = d + rt + 4 * S;
            if (needR <= baseR * maxScale) return { inside: true, d, r: Math.max(baseR, needR) };
            return { inside: false, d: Math.max(baseR + rt + 4 * S, d), r: baseR };
        }

        // 부채꼴 안 흰 글씨(어두운 테두리) 또는 바깥 색 글씨(흰 테두리)
        function drawWedgeText(txt, x, y, px, color) {
            ctx.save();
            ctx.font = `800 ${Math.round(px)}px "JetBrains Mono", Consolas, monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4.5 * S;
            ctx.strokeStyle = color ? 'rgba(255, 255, 255, 0.95)' : 'rgba(15, 23, 42, 0.45)';
            ctx.strokeText(txt, x, y + 1);
            ctx.fillStyle = color || '#FFFFFF';
            ctx.fillText(txt, x, y + 1);
            ctx.restore();
        }

        function drawInteriorAngles(corners, alpha) {
            const labels = [];
            corners.forEach((c, idx) => {
                const startA = c.outAngle;
                const endA = c.inAngle + Math.PI;
                const isFocused = (idx === state.activeCornerIndex) && (
                    state.carStage === 'WAITING_INPUT' || state.carStage === 'TURN_WRONG' || state.carStage === 'OFF_TRACK_STOP'
                );
                // 내각 크기: 시작 방향에서 시계 방향으로 잰 각 (전에는 일부 꼭짓점에서 원 전체가 그려지던 문제 수정)
                let sweep = normalizeAngleSigned(endA - startA);
                if (sweep < 0) sweep += Math.PI * 2;

                const text = `${c.interiorDeg}°`;
                const px = (isFocused ? 26 : 21) * S * labelK;
                // 변이 짧으면 이웃 내각과 겹치지 않도록 부채꼴을 작게
                const minEdge = Math.min(Math.hypot(c.vertex.x - c.prev.x, c.vertex.y - c.prev.y), Math.hypot(c.next.x - c.vertex.x, c.next.y - c.vertex.y));
                const baseR = Math.min((isFocused ? 64 : 54) * S, minEdge * 0.3);
                const fit = fitLabelInWedge(text, px, sweep, baseR, (minEdge * 0.42) / baseR, 0.55);

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.moveTo(c.vertex.x, c.vertex.y);
                ctx.arc(c.vertex.x, c.vertex.y, fit.r, startA, startA + sweep, false);
                ctx.closePath();
                ctx.fillStyle = isFocused ? 'rgba(37, 99, 235, 0.22)' : 'rgba(148, 163, 184, 0.25)';
                ctx.fill();
                ctx.lineWidth = (isFocused ? 3 : 2) * S;
                ctx.strokeStyle = isFocused ? '#2563EB' : '#64748B';
                ctx.stroke();

                ctx.restore();

                const midA = startA + sweep / 2;
                labels.push(() => {
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    drawWedgeText(text, c.vertex.x + fit.d * Math.cos(midA), c.vertex.y + fit.d * Math.sin(midA), px,
                        isFocused ? '#1D4ED8' : '#1E293B');
                    ctx.restore();
                });
            });
            return labels;
        }

        function drawArcArrowhead(x, y, radians, colorHex) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(radians);
            ctx.scale(S, S);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-10, -5);
            ctx.lineTo(-7.5, 0);
            ctx.lineTo(-10, 5);
            ctx.closePath();
            ctx.fillStyle = colorHex;
            ctx.fill();
            ctx.restore();
        }

        function drawStartFlag(startInfo, alpha) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.translate(startInfo.x, startInfo.y);
            ctx.rotate(startInfo.angle);
            ctx.scale(S, S);

            ctx.fillStyle = '#0F172A';
            ctx.fillRect(-3, -14, 6, 28);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(-3, -7, 3, 7);
            ctx.fillRect(0, 0, 3, 7);
            ctx.fillRect(-3, 7, 3, 7);
            ctx.restore();
        }

        function drawTopDownCar(x, y, angle, alpha, isWarning) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(S, S);

            // Headlight beam
            const grad = ctx.createLinearGradient(16, 0, 50, 0);
            grad.addColorStop(0, isWarning ? 'rgba(244, 63, 94, 0.42)' : 'rgba(56, 189, 248, 0.35)');
            grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(16, -9);
            ctx.lineTo(50, -19);
            ctx.lineTo(50, 19);
            ctx.lineTo(16, 9);
            ctx.closePath();
            ctx.fill();

            // Shadow
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.beginPath();
            ctx.roundRect(-20, -11, 40, 25, 8);
            ctx.fill();

            // Wheels
            ctx.fillStyle = '#0F172A';
            ctx.beginPath();
            ctx.roundRect(-14, -14, 9, 4, 1.5);
            ctx.roundRect(-14, 10, 9, 4, 1.5);
            ctx.roundRect(6, -14, 9, 4, 1.5);
            ctx.roundRect(6, 10, 9, 4, 1.5);
            ctx.fill();

            // Body
            ctx.fillStyle = isWarning ? '#be123c' : '#1E293B';
            ctx.beginPath();
            ctx.roundRect(-19, -11, 38, 22, 7);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();

            // Center stripe
            ctx.fillStyle = isWarning ? '#FDA4AF' : '#38BDF8';
            ctx.fillRect(-17, -2, 34, 4);

            // Roof
            ctx.fillStyle = '#0F172A';
            ctx.beginPath();
            ctx.roundRect(-9, -8, 18, 16, 4);
            ctx.fill();

            // Windshield
            ctx.fillStyle = isWarning ? '#FECDD3' : '#7DD3FC';
            ctx.beginPath();
            ctx.moveTo(3, -6.5);
            ctx.lineTo(8, -5.5);
            ctx.lineTo(8, 5.5);
            ctx.lineTo(3, 6.5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // ============================================================================
        // 9. 확인 문제 (외각)
        // ============================================================================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-backdrop').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }
        window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        function showOnCanvas(n) {
            closeModal();
            if (state.shapeMode !== 'CONVEX') { state.shapeMode = 'CONVEX'; renderShapeMenu(); }
            if (n >= MIN_SIDES && n <= MAX_SIDES) setPolygonSides(n);
        }

        const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }
        function makeChoices(answer, candidates) {
            const wrong = [...new Set(candidates)].filter(c => c !== answer);
            return shuffle([answer, ...shuffle(wrong).slice(0, 3)]);
        }

        // 한 외각의 크기가 자연수인 정다각형
        const REGULAR_NS = [3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 30, 36];
        const nearRegular = n => REGULAR_NS.filter(k => k !== n).sort((a, b) => Math.abs(a - n) - Math.abs(b - n));

        const QUIZ_TYPES = [
            // 외각의 합
            () => {
                const n = randInt(5, 15);
                return {
                    q: `${polyName(n)}의 외각의 크기의 합은?`,
                    answer: '360°',
                    choices: makeChoices('360°', [`${180 * (n - 2)}°`, `${180 * n}°`, '180°', `${360 * (n - 2)}°`]),
                    explain: `다각형을 한 바퀴 돌면 처음 방향으로 돌아오므로, 외각의 크기의 합은 변의 수와 관계없이 항상 360°예요.`,
                    n
                };
            },
            // 정다각형의 한 외각
            () => {
                const n = pick(REGULAR_NS.filter(k => k >= 5)), val = 360 / n;
                const near = nearRegular(n).slice(0, 2).map(k => `${360 / k}°`);
                return {
                    q: `정${polyName(n)}의 한 외각의 크기는?`,
                    answer: `${val}°`,
                    choices: makeChoices(`${val}°`, [`${180 * (n - 2) / n}°`, ...near, `${180 / n}°`].filter(v => !v.includes('.'))),
                    explain: `외각의 크기의 합은 360°이고, 정다각형은 외각 ${n}개의 크기가 모두 같아요.<br>360° ÷ ${n} = ${val}°`,
                    n
                };
            },
            // 한 외각으로 정다각형 찾기
            () => {
                const n = pick(REGULAR_NS.filter(k => k >= 5)), val = 360 / n;
                const others = nearRegular(n).slice(0, 3).map(polyName);
                return {
                    q: `한 외각의 크기가 ${val}°인 정다각형은?`,
                    answer: `정${polyName(n)}`,
                    choices: makeChoices(`정${polyName(n)}`, others.map(x => `정${x}`)),
                    explain: `360° ÷ ${val}° = ${n} 이므로 정${polyName(n)}이에요.`,
                    n
                };
            },
            // 한 내각으로 정다각형 찾기 (외각 이용)
            () => {
                const n = pick(REGULAR_NS.filter(k => k >= 5 && k <= 20)), interior = 180 * (n - 2) / n, ext = 360 / n;
                return {
                    q: `한 내각의 크기가 ${interior}°인 정다각형은?`,
                    answer: `정${polyName(n)}`,
                    choices: makeChoices(`정${polyName(n)}`, nearRegular(n).slice(0, 3).map(k => `정${polyName(k)}`)),
                    explain: `한 외각의 크기는 180° − ${interior}° = ${ext}°예요.<br>360° ÷ ${ext}° = ${n} 이므로 정${polyName(n)}이에요.`,
                    n
                };
            },
            // 한 꼭짓점의 내각과 외각
            () => {
                const interior = randInt(7, 16) * 10 + pick([0, 5]);
                const ext = 180 - interior;
                return {
                    q: `다각형의 한 꼭짓점에서 내각의 크기가 ${interior}°일 때, 이 꼭짓점의 외각의 크기는?`,
                    answer: `${ext}°`,
                    choices: makeChoices(`${ext}°`, [`${interior}°`, `${360 - interior}°`, `${ext + 10}°`, `${Math.abs(90 - ext)}°`]),
                    explain: `한 꼭짓점에서 내각과 외각을 합하면 180°(평각)예요.<br>180° − ${interior}° = ${ext}°`,
                    n: 0
                };
            }
        ];

        const quiz = { score: 0, total: 0, current: null, lastType: -1, answered: false };

        function newQuizQuestion() {
            let t;
            do { t = randInt(0, QUIZ_TYPES.length - 1); } while (t === quiz.lastType);
            quiz.lastType = t;
            quiz.current = QUIZ_TYPES[t]();
            quiz.answered = false;
            renderQuiz();
        }

        function renderQuiz(chosen) {
            const c = quiz.current;
            const choiceBtns = c.choices.map((ch, i) => {
                let cls = 'border-slate-300 bg-white hover:bg-slate-50 text-slate-900';
                if (quiz.answered) {
                    if (ch === c.answer) cls = 'border-emerald-500 bg-emerald-50 text-emerald-800';
                    else if (ch === chosen) cls = 'border-rose-500 bg-rose-50 text-rose-700';
                    else cls = 'border-slate-200 bg-white text-slate-400';
                }
                return `<button ${quiz.answered ? 'disabled' : ''} onclick="answerQuiz(${i})"
                    class="choice-btn px-3 md:px-4 py-4 md:py-5 rounded-2xl border-[3px] text-xl md:text-2xl font-extrabold font-mono-num ${cls}">
                    <span class="text-slate-400 mr-2">${'①②③④'[i]}</span>${ch}</button>`;
            }).join('');

            let feedback = '';
            if (quiz.answered) {
                const ok = chosen === c.answer;
                feedback = `
                    <div class="mt-5 rounded-2xl p-5 ${ok ? 'bg-emerald-50 border-2 border-emerald-300' : 'bg-rose-50 border-2 border-rose-300'}">
                        <div class="text-2xl font-extrabold ${ok ? 'text-emerald-700' : 'text-rose-700'} mb-2">${ok ? '정답이에요!' : `아쉬워요. 정답은 ${c.answer}`}</div>
                        <div class="text-xl font-semibold text-slate-800 leading-relaxed font-mono-num">${c.explain}</div>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 mt-4">
                        ${c.n >= MIN_SIDES && c.n <= MAX_SIDES ? `<button onclick="showOnCanvas(${c.n})" class="px-4 py-3 rounded-xl border-2 border-slate-300 text-slate-700 text-lg font-bold hover:bg-slate-50">그림으로 확인</button>` : ''}
                        <button onclick="newQuizQuestion()" class="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-lg font-extrabold flex items-center gap-2">다음 문제 <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
                    </div>`;
            }

            openModal('확인 문제', `
                <div class="flex items-center justify-between mb-4">
                    <span class="text-lg font-bold text-slate-500">문제 ${quiz.total + (quiz.answered ? 0 : 1)}</span>
                    <span class="text-lg font-extrabold text-slate-700">맞힌 문제 <span class="text-amber-600">${quiz.score}</span> / ${quiz.total}</span>
                </div>
                <p class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug mb-6">${c.q}</p>
                <div class="grid grid-cols-2 gap-3">${choiceBtns}</div>
                ${feedback}`);
        }

        function answerQuiz(i) {
            if (quiz.answered) return;
            const chosen = quiz.current.choices[i];
            quiz.answered = true;
            quiz.total++;
            if (chosen === quiz.current.answer) quiz.score++;
            renderQuiz(chosen);
        }

        // 사용법 안내 (처음 써 보는 사람용)
        function openHelp() {
            const step = (n, title, body) => `

            openModal('사용법', `

                    ${step(2, '돌 각도 입력', '핸들을 몇 도 돌려야 다음 변을 따라갈지 입력하고 <b>핸들 돌리기</b>를 눌러요. <b>내각값</b> 버튼으로 흔한 실수(내각만큼 돌기)도 보여 줄 수 있어요.')}
                    ${step(3, '한 바퀴 완주', '모든 꼭짓점을 돌면 <b>외각의 크기의 합</b> 칸에 계산식이 완성돼요. <b>자동으로 돌기</b>를 고르면 정답 각도로 알아서 돌아요.')}
                    ${step(4, '외각 모으기', '<b>외각 모으기</b>를 누르면 외각들이 한가운데로 모여 360°의 원이 돼요.')}
                    ${step(5, '모양 바꾸기', '꼭짓점을 끌어 모양을 바꿔도 외각의 합은 그대로예요. 위쪽 − / + 로 삼각형부터 팔각형까지 바꿀 수 있어요.')}

                    ${mode('#7C3AED', '별다각형', '오각별을 그리면 자동차가 두 바퀴 돌아서 외각의 합이 720°가 돼요. 별 꼭짓점 각의 합은 180° × 5 − 720° = 180°예요.')}
                </div>
                <div class="text-sm font-semibold text-slate-500">각도 보기 메뉴에서 외각·내각 숫자를 켜고 끌 수 있어요. 확인 문제에서는 매번 새 문제가 나와요.</div>`);
        }

        // ============================================================================
        // 발표용 슬라이드: 다음 중 다각형의 외각은?
        //  ① 내각의 바깥쪽 각(우각, 360° − 내각)  ② 외각(한 변과 이웃한 변의 연장선이 이루는 각)
        // ============================================================================
        const ppt = { picked: 0 };

        // 교과서 스타일 흑백 그림 (굵은 검은 선, 각은 호로 표시)
        function pptFigure(kind, annotate) {
            const P = [[160, 42], [272, 118], [232, 228], [88, 228], [48, 118]];
            const A = P[0], B = P[1], C = P[2];
            const ang = (p, q) => Math.atan2(q[1] - p[1], q[0] - p[0]);
            const pt = (c, r, a) => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
            const f = v => v.toFixed(1);
            // 시계 방향(화면 기준)으로 a0에서 a1까지의 부채꼴
            const sector = (c, r, a0, a1) => {
                while (a1 <= a0) a1 += Math.PI * 2;
                const s0 = pt(c, r, a0), s1 = pt(c, r, a1);
                return `M ${f(c[0])} ${f(c[1])} L ${f(s0[0])} ${f(s0[1])} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(s1[0])} ${f(s1[1])} Z`;
            };
            const dirExt = ang(A, B), dirBC = ang(B, C), dirBA = ang(B, A);
            const label = (xy, text, anchor) => `<text x="${f(xy[0])}" y="${f(xy[1])}" text-anchor="${anchor || 'middle'}" dominant-baseline="middle" font-size="20" font-weight="800" fill="#111">${text}</text>`;

            let extra = '', mark = '', notes = '';
            if (kind === 'ext') {
                const E = pt(B, 98, dirExt);
                extra = `<line x1="${B[0]}" y1="${B[1]}" x2="${f(E[0])}" y2="${f(E[1])}" stroke="#111" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>`;
                mark = `<path d="${sector(B, 46, dirExt, dirBC)}" fill="#D9D9D9" stroke="#111" stroke-width="2.5"/>`;
                if (annotate) {
                    notes = label(pt(B, 74, (dirExt + dirBC) / 2), '외각')
                        + label([E[0] + 8, E[1] + 4], '연장선', 'start')
                        + label([(B[0] + C[0]) / 2 - 18, (B[1] + C[1]) / 2 + 4], '한 변', 'end');
                }
            } else {
                mark = `<path d="${sector(B, 44, dirBA, dirBC)}" fill="#D9D9D9" stroke="#111" stroke-width="2.5"/>`;
                if (annotate) {
                    notes = label([B[0] + 2, B[1] - 66], '360° − (내각)');
                }
            }
            const poly = P.map(q => q.join(',')).join(' ');
            return `<svg viewBox="0 0 440 270" class="w-full h-full" role="img" aria-label="${kind === 'ext' ? '한 변과 이웃한 변의 연장선이 이루는 각' : '꼭짓점에서 다각형 바깥쪽으로 잰 큰 각'}" style="font-family: inherit">
                <polygon points="${poly}" fill="#FFFFFF" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
                ${mark}${extra}
                <circle cx="${B[0]}" cy="${B[1]}" r="5" fill="#111"/>
                ${notes}
            </svg>`;
        }

        function renderPpt() {
            const answered = ppt.picked !== 0;
            const items = [{ n: 1, kind: 'reflex' }, { n: 2, kind: 'ext' }];
            document.getElementById('ppt-choices').innerHTML = items.map(it => {
                // 맞고 틀림은 표시하지 않음: 고른 그림만 굵은 테두리로
                let cls = 'border-slate-300 hover:border-slate-900 hover:bg-slate-50';
                let badge = '';
                if (answered) {
                    cls = ppt.picked === it.n ? 'border-slate-900 bg-slate-50' : 'border-slate-300';
                    if (ppt.picked === it.n) badge = '<span class="text-slate-500">선택</span>';
                }
                return `<button ${answered ? 'disabled' : ''} onclick="pickPpt(${it.n})" class="choice-btn rounded-3xl border-[4px] ${cls} p-4 md:p-6 flex flex-col items-stretch text-left">
                    <span class="flex items-center justify-between text-[clamp(1.4rem,2.4vw,2.4rem)] font-black text-slate-900">
                        <span style="font-family: 'Times New Roman', 'Noto Serif KR', serif">${'①②'[it.n - 1]}</span>
                        <span class="text-[clamp(1rem,1.6vw,1.6rem)] font-extrabold">${badge}</span>
                    </span>
                    <span class="block mx-auto w-full ${answered ? 'h-[clamp(9rem,24vh,18rem)]' : 'h-[clamp(12rem,42vh,30rem)]'} transition-all">${pptFigure(it.kind, answered && it.kind === 'ext')}</span>
                </button>`;
            }).join('');

            const ans = document.getElementById('ppt-answer');
            ans.classList.toggle('hidden', !answered);
            if (!answered) { ans.innerHTML = ''; return; }
            ans.innerHTML = `
                <div class="border-[3px] border-slate-900 rounded-2xl p-5 md:p-7 flex flex-col md:flex-row gap-4 md:gap-6 md:items-center">
                    <span class="self-start shrink-0 px-4 py-1.5 rounded-lg bg-slate-900 text-white text-[clamp(1.1rem,1.8vw,1.8rem)] font-black">외각의 정의</span>
                    <div class="flex flex-col gap-2">
                        <p class="text-[clamp(1.25rem,2.2vw,2.3rem)] font-bold text-slate-900 leading-snug">
                            다각형의 한 꼭짓점에서 <b class="font-black underline decoration-4 underline-offset-4">한 변</b>과 <b class="font-black underline decoration-4 underline-offset-4">그 변에 이웃한 변의 연장선</b>이 이루는 각을 그 꼭짓점에서의 <b class="font-black">외각</b>이라고 한다.
                        </p>
                        <p class="text-[clamp(1rem,1.6vw,1.7rem)] font-bold text-slate-600">한 꼭짓점에서 (내각의 크기) + (외각의 크기) = 180°</p>
                    </div>
                </div>
                <div class="flex flex-wrap justify-end gap-3">
                    <button onclick="ppt.picked = 0; renderPpt()" class="px-5 py-3 rounded-xl border-2 border-slate-300 text-slate-700 text-lg font-bold hover:bg-slate-50">다시 고르기</button>
                    <button onclick="closePpt()" class="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-700 text-white text-lg font-extrabold flex items-center gap-2">실험하러 가기 <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
                </div>`;
            lucide.createIcons();
        }

        function pickPpt(n) {
            if (ppt.picked) return;
            ppt.picked = n;
            renderPpt();
        }

        function openPpt() {
            ppt.picked = 0;
            renderPpt();
            document.getElementById('ppt-slide').classList.remove('hidden');
        }

        function closePpt() {
            document.getElementById('ppt-slide').classList.add('hidden');
        }
        window.addEventListener('keydown', e => { if (e.key === 'Escape') closePpt(); });

        // ---------------------------------------------------------------------------
        // 일반 다각형: 내각이 모두 10°의 배수인 볼록다각형을 무작위로 만듦
        //  외각 e(= 180° − 내각)를 10°의 배수로 골라 합을 360°로 맞추고,
        //  그 방향으로 변을 이어 닫히도록 마지막 두 변의 길이를 계산
        // ---------------------------------------------------------------------------
        function randomExteriorAngles(n) {
            const minE = n === 3 ? 50 : 20;                      // 내각 최대 130°(삼각형) / 160°
            const maxE = Math.min(150, 360 - minE * (n - 1));    // 내각 최소 30°
            for (let t = 0; t < 400; t++) {
                const e = Array(n).fill(minE);
                let units = (360 - minE * n) / 10;
                while (units > 0) {
                    const k = Math.floor(Math.random() * n);
                    if (e[k] + 10 <= maxE) { e[k] += 10; units--; }
                }
                // 정다각형처럼 보이지 않도록 크기 차이가 있게
                if (Math.max(...e) - Math.min(...e) >= (n <= 4 ? 30 : 20)) return e;
            }
            return null;
        }

        function buildPolygonFromExterior(e) {
            const n = e.length;
            const dirs = [];
            let h = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;   // 첫 변의 방향
            for (let i = 0; i < n; i++) { dirs.push(h); h += e[i] * Math.PI / 180; }
            for (let t = 0; t < 300; t++) {
                const L = dirs.map(() => 0.6 + Math.random() * 0.8);
                // 마지막 두 변 길이 a, b: Σ L·u = 0
                let sx = 0, sy = 0;
                for (let i = 0; i < n - 2; i++) { sx += L[i] * Math.cos(dirs[i]); sy += L[i] * Math.sin(dirs[i]); }
                const u1 = [Math.cos(dirs[n - 2]), Math.sin(dirs[n - 2])], u2 = [Math.cos(dirs[n - 1]), Math.sin(dirs[n - 1])];
                const det = u1[0] * u2[1] - u1[1] * u2[0];
                if (Math.abs(det) < 1e-6) continue;
                const a = (-sx * u2[1] + sy * u2[0]) / det;
                const b = (-u1[0] * sy + u1[1] * sx) / det;
                if (a < 0.45 || b < 0.45 || a > 1.9 || b > 1.9) continue;
                L[n - 2] = a; L[n - 1] = b;
                // 꼭짓점: 변 i는 꼭짓점 i → i+1. 꼭짓점 i의 외각 = 변 i−1과 변 i의 방향 차이
                const pts = [{ x: 0, y: 0 }];
                for (let i = 0; i < n - 1; i++) pts.push({ x: pts[i].x + L[i] * Math.cos(dirs[i]), y: pts[i].y + L[i] * Math.sin(dirs[i]) });
                return pts;
            }
            return null;
        }

        function makeGeneralPolygon() {
            if (state.shapeMode !== 'CONVEX') return;
            const n = state.numSides;
            initRegularPolygon(n);   // 화면 배치(중심·크기) 계산
            const reg = state.vertices;
            const rcx = reg.reduce((a, v) => a + v.x, 0) / n, rcy = reg.reduce((a, v) => a + v.y, 0) / n;
            const R = Math.max(...reg.map(v => Math.hypot(v.x - rcx, v.y - rcy)));
            for (let t = 0; t < 60; t++) {
                const e = randomExteriorAngles(n);
                const pts = e && buildPolygonFromExterior(e);
                if (!pts) continue;
                // 정다각형과 같은 크기의 틀 안에 들어가도록 확대·이동
                const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
                const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
                const k = (2 * R) / Math.max(bw, bh) * 0.98;
                const mx = (Math.max(...xs) + Math.min(...xs)) / 2, my = (Math.max(...ys) + Math.min(...ys)) / 2;
                const verts = pts.map(p => ({ x: rcx + (p.x - mx) * k, y: rcy + (p.y - my) * k }));
                if (!isStrictlyConvexClockwise(verts)) continue;
                state.vertices = verts;
                state.lapCount = 1;
                resetCarSimulation();
                return;
            }
        }

        function openQuiz() {
            if (!quiz.current || quiz.answered) newQuizQuestion();
            else renderQuiz();
        }

        window.onload = function () {
            try {
                const saved = localStorage.getItem('polygonLab.boardMode');
                // 저장된 설정이 없으면 큰 화면(전자칠판·대형 모니터)에서만 칠판 모드로 시작
                state.boardMode = saved !== null ? saved === '1' : window.innerWidth >= 1280;
            } catch (e) {}
            applyBoardMode();
            renderViewMenu();
            renderShapeMenu();
            renderExtensionButton();
            resizeCanvas();
            setPolygonSides(state.numSides);
            requestAnimationFrame(animateLoop);
        };

    </script>
