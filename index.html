    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
    <style>
        * {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }
        /* 수업용 밝은 화면 하나로 고정 (어두운 테마에서도 같은 모습) */
        :root { color-scheme: light; --page-bg: #F8FAFC; --ink: #0F172A; }
        html, body { height: 100%; }
        body { background: var(--page-bg); color: var(--ink); }
        @media (max-width: 1023px) { html, body { height: auto; } }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        button:focus-visible, input:focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
        /* 칠판 모드: 화면 전체 글자·버튼을 키움 (rem 기준) */
        html { font-size: 16px; }
        html.board { font-size: clamp(15px, 1.04vw, 24px); }
        .section-label { font-size: 0.75rem; font-weight: 800; color: #475569; letter-spacing: 0.02em; }
        .icon { display: inline-block; flex-shrink: 0; }
        #modal-backdrop { background: rgba(15, 23, 42, 0.55); }
        .choice-btn { transition: transform .12s ease, background-color .15s ease, border-color .15s ease; }
        .choice-btn:active { transform: scale(0.97); }
        .bg-math-grid {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(#CBD5E1 1.25px, transparent 1.25px),
                linear-gradient(to right, rgba(226, 232, 240, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.55) 1px, transparent 1px);
            background-size: 24px 24px, 96px 96px, 96px 96px;
            background-position: -1px -1px;
        }
        input[type=range].gather-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #E2E8F0;
            border-radius: 999px;
            outline: none;
        }
        input[type=range].gather-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            background: #0F172A;
            cursor: pointer;
            border: 3px solid #FFFFFF;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.25);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type=range].gather-slider::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            background: #2563EB;
        }
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 999px;
        }
    </style>

<body style="margin:0">
<div id="app" class="lg:h-full w-full lg:overflow-hidden bg-slate-50 text-slate-900 flex flex-col">

    <!-- Top Toolbar -->
    <header class="xl:h-14 bg-white border-b border-slate-200 px-4 py-2 xl:py-0 flex flex-wrap items-center justify-between gap-2 xl:gap-3 shrink-0 z-20">
        <div class="flex flex-wrap items-center gap-2 lg:gap-3 min-w-0">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center">
                    <i data-lucide="compass" class="w-4 h-4"></i>
                </div>
                <span class="hidden min-[1800px]:inline font-extrabold text-base tracking-tight text-slate-900">다각형 외각의 합 실험실</span>
            </div>

            <!-- n각형 선택 (3 ~ 8) -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                <button onclick="changeSides(-1)" id="btn-sides-minus" title="변의 수 줄이기" class="w-9 h-9 rounded-lg bg-white text-slate-900 font-extrabold text-xl leading-none shadow-sm hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-30 disabled:shadow-none">−</button>
                <div class="px-2 min-w-[8.5rem] text-center leading-tight">
                    <div id="sides-label" class="text-base font-extrabold text-slate-900">삼각형</div>
                    <div id="sides-sub" class="text-xs font-bold text-slate-500 font-mono-num">n = 3</div>
                </div>
                <button onclick="changeSides(1)" id="btn-sides-plus" title="변의 수 늘리기" class="w-9 h-9 rounded-lg bg-white text-slate-900 font-extrabold text-xl leading-none shadow-sm hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-30 disabled:shadow-none">+</button>
            </div>

            <button onclick="resetToRegularPolygon()" class="shrink-0 px-3 py-2 rounded-xl text-sm font-bold border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center gap-1.5">
                <i data-lucide="layout-grid" class="w-4 h-4 text-slate-500"></i>
                <span id="text-reset-shape" class="hidden sm:inline">정다각형으로</span>
            </button>
            <button onclick="makeGeneralPolygon()" id="btn-general" title="누를 때마다 내각이 모두 10°의 배수인 새 다각형" class="shrink-0 px-3 py-2 rounded-xl text-sm font-bold border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center gap-1.5">
                <i data-lucide="shuffle" class="w-4 h-4 text-slate-500"></i>
                <span>일반 다각형</span>
            </button>
        </div>

        <div class="flex flex-wrap items-center gap-2 min-w-0 xl:shrink-0">
            <!-- 응용: 오목다각형 · 별다각형 -->
            <div class="relative">
                <button onclick="toggleShapeMenu(event)" id="btn-shape-menu" class="px-3 py-2 rounded-xl text-sm font-extrabold border-2 transition-all flex items-center gap-1.5">
                    <i data-lucide="star" class="w-4 h-4"></i>
                    <span id="text-shape-btn">응용</span>
                </button>
                <div id="shape-menu" class="hidden fixed left-4 right-4 top-28 md:absolute md:left-auto md:right-0 md:top-full md:mt-2 md:w-[24rem] bg-white border-2 border-slate-200 rounded-2xl shadow-2xl p-2 z-40" onclick="event.stopPropagation()">
                    <div id="shape-menu-items"></div>
                </div>
            </div>
            <div class="relative">
                <button onclick="toggleViewMenu(event)" id="btn-view-menu" class="px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all flex items-center gap-1.5">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                    <span>각도 보기</span>
                    <span id="view-count" class="ml-0.5 px-1.5 rounded-md bg-indigo-600 text-white text-xs font-mono-num">2</span>
                </button>
                <div id="view-menu" class="hidden fixed left-4 right-4 top-28 md:absolute md:left-auto md:right-0 md:top-full md:mt-2 md:w-[22rem] bg-white border-2 border-slate-200 rounded-2xl shadow-2xl p-2 z-40" onclick="event.stopPropagation()">
                    <div id="view-menu-items"></div>
                    <div class="flex gap-2 p-2 pt-3 mt-1 border-t border-slate-100">
                        <button onclick="setAllViews(false)" class="flex-1 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-700 hover:bg-slate-50">모두 끄기</button>
                        <button onclick="setAllViews(true)" class="flex-1 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-700 hover:bg-slate-50">모두 켜기</button>
                    </div>
                </div>
            </div>
            <div class="hidden lg:block h-6 w-px bg-slate-200 mx-1"></div>
            <button onclick="openHelp()" class="px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-1.5">
                <i data-lucide="info" class="w-4 h-4"></i>
                <span>사용법</span>
            </button>
            <button onclick="openPpt()" class="px-3 py-2 rounded-xl text-sm font-extrabold bg-slate-900 hover:bg-slate-700 text-white transition-all flex items-center gap-1.5 active:scale-95">
                <i data-lucide="presentation" class="w-4 h-4"></i>
                <span>PPT</span>
            </button>
            <button onclick="openQuiz()" class="px-3 py-2 rounded-xl text-sm font-extrabold bg-amber-500 hover:bg-amber-600 text-white transition-all flex items-center gap-1.5 active:scale-95">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
                <span>확인 문제</span>
            </button>
            <div class="hidden lg:block h-6 w-px bg-slate-200 mx-1"></div>
            <button onclick="toggleBoardMode()" id="btn-board" title="전자칠판용 큰 화면" class="hidden lg:flex px-3 py-2 rounded-xl text-sm font-extrabold border-2 transition-all flex items-center gap-1.5">
                <i data-lucide="monitor" class="w-4 h-4"></i>
                <span id="text-board-btn">칠판 모드</span>
            </button>
            <button onclick="toggleFullscreen()" id="btn-fullscreen" title="전체 화면" class="hidden lg:block p-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
        </div>

    <main class="flex-1 flex flex-col lg:flex-row lg:overflow-hidden">

        <!-- LEFT: Canvas -->

                        외각 모으기

                    <span class="text-sm font-extrabold font-mono-num text-slate-900 w-12 text-right" id="gatherValueLabel">0%</span>
                </div>
            </div>
        </section>

        <!-- RIGHT: Control Panel -->
        <aside class="w-full lg:w-[34%] xl:w-[30%] lg:h-full bg-white border-t lg:border-t-0 lg:border-l border-slate-200 flex flex-col p-4 lg:overflow-y-auto z-10 gap-3">

            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button onclick="setSteeringMode('MANUAL')" id="mode-manual-btn" class="py-2 rounded-lg text-sm font-extrabold transition-all bg-white text-slate-900 shadow-sm flex items-center justify-center gap-1.5">
                        <i data-lucide="sliders" class="w-4 h-4 text-blue-600"></i>
                        <span>각도 직접 입력</span>
                    </button>
                    <button onclick="setSteeringMode('AUTO')" id="mode-auto-btn" class="py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span>자동으로 돌기</span>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="handlePrimaryDriveAction()" id="btn-drive-corner" class="flex-1 py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-base transition-all flex items-center justify-center gap-2">
                        <i data-lucide="play" class="w-5 h-5"></i>
                        <span id="text-drive-corner">코너 A로 이동</span>
                    </button>
                    <button onclick="toggleExtension()" id="btn-extension" title="연장선(원래 가던 방향) 보이기/숨기기" class="py-3 px-3 rounded-xl border-2 font-extrabold text-sm transition-all flex items-center gap-1.5 shrink-0">
                        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 18 9 12"/><path d="M12 9l2-2M17 4l1.5-1.5" stroke-dasharray="2 3"/></svg>
                        <span id="text-extension">연장선</span>
                    </button>
                    <button onclick="resetCarSimulation()" class="p-3 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-700 transition-all" title="출발선으로 초기화">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>
                </div>

                <div id="manual-steering-panel" class="p-3.5 rounded-2xl border-2 border-slate-200 bg-slate-50/70 space-y-2.5 transition-all">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                            <span id="active-vertex-dot" class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                            <span id="manual-panel-title">코너 이동 후 입력 가능</span>

                        <span id="interior-hint-badge" class="text-sm font-bold font-mono-num px-2 py-0.5 rounded-md bg-slate-200 text-slate-700">내각 --°</span>

                    <div class="flex items-center gap-2">
                        <div class="relative flex-1">
                            <input type="number" id="angleInput" min="-360" max="360" placeholder="몇 도 돌까요?"

                        <button onclick="submitManualAngle()" id="btn-turn-wheel" class="py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-extrabold text-sm transition-all flex items-center gap-1.5 shrink-0">
                            <i data-lucide="rotate-cw" class="w-4 h-4"></i>

                    <div id="left-turn-hint" class="hidden text-sm font-bold text-orange-700 bg-orange-50 border border-orange-200 rounded-lg px-2.5 py-1.5">

                    <div class="grid grid-cols-5 gap-1.5">

                        <button onclick="adjustAngleInput(5)" class="py-2 rounded-lg bg-white border-2 border-slate-200 hover:bg-slate-100 font-mono-num text-sm font-bold text-slate-700">+5°</button>
                        <button onclick="adjustAngleInput(10)" class="py-2 rounded-lg bg-white border-2 border-slate-200 hover:bg-slate-100 font-mono-num text-sm font-bold text-slate-700">+10°</button>
                        <button onclick="setInputToInteriorWrong()" id="btn-preset-interior" class="py-2 rounded-lg bg-amber-50 border-2 border-amber-200 hover:bg-amber-100 font-mono-num text-xs font-extrabold text-amber-800" title="학생들이 흔히 하는 실수: 내각만큼 돌기">내각값</button>
                    </div>

                    <div id="turn-feedback-box" class="hidden pt-2 border-t border-slate-200 space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            <span id="feedback-status-text" class="text-base font-extrabold"></span>
                            <span id="feedback-diff-badge" class="text-sm font-mono-num font-bold px-2 py-0.5 rounded-md"></span>
                        </div>
                        <div id="wrong-action-buttons" class="grid grid-cols-2 gap-1.5">
                            <button onclick="triggerOffTrackDrive()" id="btn-offtrack" class="py-2.5 px-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm transition-all flex items-center justify-center gap-1">
                                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                                <span id="text-offtrack">이 방향 그대로 직진</span>
                            </button>
                            <button onclick="snapToCorrectAngle()" class="py-2.5 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm transition-all flex items-center justify-center gap-1">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                <span id="text-snap-correct">정답(120°)으로 바로잡기</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 핸들 · 누적 외각 -->
            <div class="grid grid-cols-2 gap-2.5 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <div class="bg-white rounded-xl p-2.5 border border-slate-200 flex flex-col items-center justify-between">
                    <span class="section-label">핸들을 돌린 각</span>
                    <div class="relative my-1 flex items-center justify-center w-32 h-32">
                        <div class="absolute -top-0.5 z-10 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[9px] border-t-rose-500"></div>
                        <svg id="steering-wheel-svg" viewBox="0 0 100 100" class="w-28 h-28 transition-transform">
                            <circle cx="50" cy="50" r="42" fill="none" stroke="#1E293B" stroke-width="11" />
                            <circle cx="50" cy="50" r="42" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="12 8" />
                            <path d="M 44 8.5 A 42 42 0 0 1 56 8.5" fill="none" stroke="#F43F5E" stroke-width="11.5" />
                            <path d="M 14 48 L 38 48 L 38 56 L 14 54 Z" fill="#334155" />
                            <path d="M 86 48 L 62 48 L 62 56 L 86 54 Z" fill="#334155" />
                            <path d="M 46 60 L 46 86 L 54 86 L 54 60 Z" fill="#334155" />
                            <circle cx="50" cy="50" r="15" fill="#0F172A" stroke="#475569" stroke-width="2" />
                            <path d="M 50 40 L 56 54 L 50 51 L 44 54 Z" fill="#38BDF8" />
                        </svg>
                    </div>
                    <div class="text-center w-full pt-1 border-t border-slate-100">
                        <span class="text-xs font-bold text-slate-500 block">이번 코너</span>
                        <span id="current-turn-angle" class="text-2xl font-extrabold font-mono-num text-slate-900">0°</span>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-2.5 border border-slate-200 flex flex-col items-center justify-between">
                    <span class="section-label">지금까지 돈 각</span>
                    <div class="relative my-1 flex items-center justify-center w-32 h-32">
                        <svg id="pizza-gauge-svg" viewBox="0 0 100 100" class="w-28 h-28 -rotate-90">
                            <circle cx="50" cy="50" r="42" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
                            <g id="pizza-wedges-group"></g>
                            <circle cx="50" cy="50" r="22" fill="#FFFFFF" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span id="gauge-center-num" class="text-base font-extrabold font-mono-num text-slate-900">0°</span>
                            <span id="gauge-denominator" class="text-xs font-bold text-slate-500">/ 360°</span>
                        </div>
                    </div>
                    <div class="text-center w-full pt-1 border-t border-slate-100">
                        <span class="text-xs font-bold text-slate-500 block">누적 합계</span>
                        <span id="cumulative-turn-angle" class="text-2xl font-extrabold font-mono-num text-blue-700">0°</span>
                    </div>
                </div>
            </div>

            <!-- 외각의 합 계산식 -->
            <div class="bg-slate-900 text-white p-4 rounded-2xl space-y-3 mt-auto">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-300">외각의 크기의 합</span>
                    <span id="corner-progress-badge" class="text-sm font-extrabold font-mono-num px-2 py-0.5 rounded-md bg-slate-800 text-sky-300">0 / 3 완료</span>
                </div>
                <div id="angle-pills-container" class="flex flex-wrap items-center gap-1.5 min-h-[2.5rem]"></div>
                <div id="interior-sum-line" class="text-sm font-bold text-slate-300 font-mono-num border-t border-slate-700 pt-2"></div>
            </div>
        </aside>
    </main>

    <!-- 발표용 슬라이드: 다음 중 다각형의 외각은? -->
    <div id="ppt-slide" class="hidden fixed inset-0 z-[60] bg-white flex flex-col overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-3 border-b-2 border-slate-900 shrink-0">
            <span class="text-base md:text-lg font-extrabold text-slate-900">다각형의 외각</span>
            <button onclick="closePpt()" title="닫기 (Esc)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-700">
                <i data-lucide="x" class="w-7 h-7"></i>
            </button>
        </div>
        <div class="flex-1 w-full max-w-[96rem] mx-auto flex flex-col justify-center gap-5 md:gap-7 px-5 md:px-10 py-6">
            <h1 class="ppt-q text-[clamp(1.75rem,3.4vw,3.6rem)] font-black text-slate-900 leading-tight">다음 중 다각형의 외각은?</h1>
            <div id="ppt-choices" class="grid md:grid-cols-2 gap-5 md:gap-8"></div>
            <div id="ppt-answer" class="hidden flex flex-col gap-4"></div>
        </div>
    </div>

    <!-- 확인 문제 창 -->
    <div id="modal-backdrop" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6" onclick="if (event.target === this) closeModal()">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-[62rem] max-h-full flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 shrink-0">
                <h2 id="modal-title" class="text-2xl font-extrabold text-slate-900">확인 문제</h2>
                <button onclick="closeModal()" title="닫기" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600">
                    <i data-lucide="x" class="w-7 h-7"></i>
                </button>
            </div>
            <div id="modal-body" class="p-4 md:p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // ============================================================================
        // 0. 아이콘 (인터넷 없이 동작하도록 SVG를 파일 안에 포함)
        // ============================================================================
        const ICONS = {
            'compass': '<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/>',
            'layout-grid': '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
            'sliders': '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
            'sparkles': '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
            'play': '<polygon points="6 3 20 12 6 21 6 3"/>',
            'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
            'rotate-cw': '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
            'alert-triangle': '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
            'check': '<path d="M20 6 9 17l-5-5"/>',
            'eye': '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
            'help-circle': '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
            'monitor': '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
            'maximize': '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
            'x': '<path d="M18 6 6 18M6 6l12 12"/>',
            'shuffle': '<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',
            'presentation': '<path d="M2 3h20M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3M12 16v5M8 21h8"/>',
            'info': '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
            'star': '<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/>',
            'arrow-right': '<path d="M5 12h14M13 6l6 6-6 6"/>'
        };
        function renderIcons() {
            document.querySelectorAll('i[data-lucide]').forEach(el => {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('stroke-width', '2.2');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                svg.setAttribute('class', 'icon ' + (el.getAttribute('class') || ''));
                svg.innerHTML = ICONS[el.getAttribute('data-lucide')] || '';
                el.replaceWith(svg);
            });
        }
        const lucide = { createIcons: renderIcons };
        lucide.createIcons();

        // ============================================================================
        // 1. VERTEX LABELS & RAINBOW PALETTE
        // ============================================================================
        const MIN_SIDES = 3, MAX_SIDES = 8;
        const VERTEX_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        const KOR_DIGITS = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
        function polyName(n) {
            const tens = Math.floor(n / 10), ones = n % 10;
            let s = '';
            if (tens > 0) s += (tens > 1 ? KOR_DIGITS[tens] : '') + '십';
            s += KOR_DIGITS[ones];
            return s + '각형';
        }

        // 별다각형 {n/k}: n개의 점을 k칸씩 건너뛰며 이은 모양
        const STAR_TYPES = [
            { n: 5, k: 2, name: '오각별' },
            { n: 7, k: 2, name: '칠각별 (2칸)' },
            { n: 7, k: 3, name: '칠각별 (3칸)' },
            { n: 8, k: 3, name: '팔각별' }
        ];
        // 외각의 합(자동차가 한 바퀴 돌며 꺾은 각의 합) = 360° × 바퀴 수
        function getTurnTarget() { return 360 * (state.lapCount || 1); }

        // 칠판 모드 배율 (캔버스 글자·선·점 크기)
        let S = 1;
        let labelK = 1; // 작은 화면용 글자 배율
        const monoFont = (px) => `800 ${Math.round(px * S)}px "JetBrains Mono", Consolas, monospace`;

        const CORNER_COLORS = [
            { name: 'A', hex: '#F43F5E', fill: 'rgba(244, 63, 94, 0.28)', solidFill: 'rgba(244, 63, 94, 0.85)', badgeBg: '#FFE4E6', badgeText: '#E11D48' }, // Rose
            { name: 'B', hex: '#F59E0B', fill: 'rgba(245, 158, 11, 0.28)', solidFill: 'rgba(245, 158, 11, 0.85)', badgeBg: '#FEF3C7', badgeText: '#D97706' }, // Amber
            { name: 'C', hex: '#10B981', fill: 'rgba(16, 185, 129, 0.28)', solidFill: 'rgba(16, 185, 129, 0.85)', badgeBg: '#D1FAE5', badgeText: '#059669' }, // Emerald
            { name: 'D', hex: '#0EA5E9', fill: 'rgba(14, 165, 233, 0.28)', solidFill: 'rgba(14, 165, 233, 0.85)', badgeBg: '#E0F2FE', badgeText: '#0284C7' }, // Sky
            { name: 'E', hex: '#8B5CF6', fill: 'rgba(139, 92, 246, 0.28)', solidFill: 'rgba(139, 92, 246, 0.85)', badgeBg: '#EDE9FE', badgeText: '#7C3AED' }, // Violet
            { name: 'F', hex: '#EC4899', fill: 'rgba(236, 72, 153, 0.28)', solidFill: 'rgba(236, 72, 153, 0.85)', badgeBg: '#FCE7F3', badgeText: '#DB2777' }, // Pink
            { name: 'G', hex: '#6366F1', fill: 'rgba(99, 102, 241, 0.28)', solidFill: 'rgba(99, 102, 241, 0.85)', badgeBg: '#E0E7FF', badgeText: '#4338CA' }, // Indigo
            { name: 'H', hex: '#84CC16', fill: 'rgba(132, 204, 22, 0.28)', solidFill: 'rgba(132, 204, 22, 0.88)', badgeBg: '#ECFCCB', badgeText: '#4D7C0F' }  // Lime
        ];

        // ============================================================================
        // 2. APPLICATION STATE
        // ============================================================================
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            numSides: 3,
            vertices: [],
            draggingVertexIndex: -1,
            hoveredVertexIndex: -1,

            // Display Options
            steeringMode: 'MANUAL', // 'MANUAL' | 'AUTO'
            showAllAnglesAlways: false,
            showInteriorAngles: true,
            showExteriorNumbers: true, // 외각 부채꼴 안 숫자
            showExtension: false, // 연장선 (처음에는 숨김 → 버튼으로 보여 줌)
            boardMode: true, // 전자칠판용 큰 화면
            shapeMode: 'CONVEX', // 'CONVEX' 볼록 | 'CONCAVE' 오목 | 'STAR' 별
            starIndex: 0,
            lapCount: 1,
            gatherRatio: 0,
            gatherAnimTarget: null,

            // Car & Corner State Machine
            // carStage:
            // 'START_LINE'     : Parked at start line before Corner A
            // 'DRIVING_TO_V'   : Animating along edge toward activeCornerIndex
            // 'WAITING_INPUT'  : Stopped at vertex with green extension laser; waiting for teacher's angle input
            // 'TURNING'        : Animating car rotation to targetTurnDeg (could be right or wrong)
            // 'TURN_WRONG'     : Turned to a wrong angle; showing red warning laser & off-track button
            // 'DRIVING_OFF'    : Driving off-track along the wrong angle ray
            // 'OFF_TRACK_STOP' : Stopped off-track in space
            // 'TURN_CORRECT'   : Turned to exact exterior angle; ready for next corner (or final return)
            // 'RETURNING_HOME' : Driving from final corner back to start flag
            // 'LAP_COMPLETE'   : Full 360° lap completed
            carStage: 'START_LINE',
            activeCornerIndex: 0,
            completedCorners: 0,

            // Animation interpolation
            animProgress: 0,
            turnStartDeg: 0,
            turnTargetDeg: 0,
            enteredAngleDeg: null,
            isTargetAngleCorrect: false,
            offTrackDistance: 0,

            // Real-time Car Pose
            carX: 0,
            carY: 0,
            carAngle: 0,
            currentCornerTurnDeg: 0,
            cumulativeTurnDeg: 0
        };

        // ============================================================================
        // 3. GEOMETRY & CONVEX POLYGON ENGINE
        // ============================================================================
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const oldW = canvas.width / dpr || rect.width;
            const oldH = canvas.height / dpr || rect.height;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (state.vertices.length === 0) {
                initRegularPolygon(state.numSides);
            } else if (oldW > 0 && oldH > 0) {
                const dx = (rect.width - oldW) / 2;
                const dy = (rect.height - oldH) / 2;
                state.vertices.forEach(v => {
                    v.x += dx;
                    v.y += dy;
                });
                syncStaticCarPose();
            }
        }

        window.addEventListener('resize', () => {
            const oldS = S;
            if (typeof applyBoardMode === 'function') applyBoardMode();
            resizeCanvas();
            // 크기 배율이 바뀌면(전체 화면 전환 등) 다각형을 새 화면에 맞게 다시 배치
            if (Math.abs(S - oldS) > 0.01) initRegularPolygon(state.numSides);
        });

        function getCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            return { w: canvas.width / dpr, h: canvas.height / dpr };
        }

        function initRegularPolygon(n) {
            const { w, h } = getCanvasSize();
            // 위쪽 여백과 아래 '외각 모으기' 패널 사이에, 외각 부채꼴이 들어갈 자리를 남기고 배치
            const cr = canvas.getBoundingClientRect();
            const panelTop = document.getElementById('gather-panel').getBoundingClientRect().top - cr.top;
            const wr = Math.min(w, h) * 0.13;
            const top = wr * 0.9, bottom = Math.min(h, panelTop) - wr * 0.8;
            const cx = w / 2;
            const cy = (top + bottom) / 2;
            const radius = Math.max(100, Math.min(w * 0.28, (bottom - top) / 2));

            state.vertices = [];
            const startAngle = -Math.PI / 2;
            if (state.shapeMode === 'STAR') {
                // 별다각형 {n/k}: 정n각형의 점을 k칸씩 건너뛰며 이음
                const { n: sn, k } = STAR_TYPES[state.starIndex];
                for (let i = 0; i < sn; i++) {
                    const theta = startAngle + ((i * k) % sn) * 2 * Math.PI / sn;
                    state.vertices.push({ x: cx + radius * Math.cos(theta), y: cy + radius * Math.sin(theta) });
                }
            } else {
                for (let i = 0; i < n; i++) {
                    const theta = startAngle + (i * 2 * Math.PI) / n;
                    state.vertices.push({ x: cx + radius * Math.cos(theta), y: cy + radius * Math.sin(theta) });
                }
                if (state.shapeMode === 'CONCAVE') dentOneVertex();
            }
            state.lapCount = getLapCount(state.vertices);
            resetCarSimulation();
        }

        // 꼭짓점 하나를 안쪽으로 밀어 넣어 오목다각형을 만듦
        function dentOneVertex() {
            const n = state.vertices.length;
            const idx = Math.round(n / 2) % n;
            const prev = state.vertices[(idx - 1 + n) % n], next = state.vertices[(idx + 1) % n], v = state.vertices[idx];
            const mid = { x: (prev.x + next.x) / 2, y: (prev.y + next.y) / 2 };
            for (const f of [0.5, 0.35, 0.2]) {
                const trial = state.vertices.map(p => ({ ...p }));
                trial[idx] = { x: mid.x + (mid.x - v.x) * f, y: mid.y + (mid.y - v.y) * f };
                if (isSimpleTurnPolygon(trial)) { state.vertices = trial; return; }
            }
        }

        // 한 바퀴 돌며 꺾은 각(부호 있음)의 합 ÷ 360° = 몇 바퀴 돌았는지
        function getLapCount(verts) {
            const n = verts.length;
            let total = 0;
            for (let i = 0; i < n; i++) {
                const prev = verts[(i - 1 + n) % n], curr = verts[i], next = verts[(i + 1) % n];
                total += normalizeAngleSigned(Math.atan2(next.y - curr.y, next.x - curr.x) - Math.atan2(curr.y - prev.y, curr.x - prev.x));
            }
            return Math.round(total / (2 * Math.PI));
        }

        function segmentsCross(p1, p2, p3, p4) {
            const d = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
            const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
            return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
        }
        function distPointToSegment(p, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy || 1)));
            return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
        }

        // 변의 길이와 꺾는 각이 너무 극단적이지 않은지 (오목·별 공통)
        function hasReasonableTurns(verts, maxTurnDeg) {
            const n = verts.length;
            for (let i = 0; i < n; i++) {
                const prev = verts[(i - 1 + n) % n], curr = verts[i], next = verts[(i + 1) % n];
                if (Math.hypot(next.x - curr.x, next.y - curr.y) < 60) return false;
                const t = Math.abs(normalizeAngleSigned(Math.atan2(next.y - curr.y, next.x - curr.x) - Math.atan2(curr.y - prev.y, curr.x - prev.x)));
                if (t < (15 * Math.PI) / 180 || t > (maxTurnDeg * Math.PI) / 180) return false;
            }
            return true;
        }

        // 오목다각형: 변끼리 엇갈리지 않고, 시계 방향으로 한 바퀴
        function isSimpleTurnPolygon(verts) {
            const n = verts.length;
            if (!hasReasonableTurns(verts, 165) || getLapCount(verts) !== 1) return false;
            for (let i = 0; i < n; i++) {
                const a = verts[i], b = verts[(i + 1) % n];
                for (let j = i + 2; j < n; j++) {
                    if (i === 0 && j === n - 1) continue;
                    if (segmentsCross(a, b, verts[j], verts[(j + 1) % n])) return false;
                }
                for (let k = 0; k < n; k++) {
                    if (k === i || k === (i + 1) % n) continue;
                    if (distPointToSegment(verts[k], a, b) < 30) return false;
                }
            }
            return true;
        }

        // 지금 모드에서 허용되는 모양인지
        function isValidShape(verts) {
            if (state.shapeMode === 'CONCAVE') return isSimpleTurnPolygon(verts);
            if (state.shapeMode === 'STAR') {
                // 별은 모양을 바꿔도 처음과 같은 바퀴 수를 유지해야 함
                if (!hasReasonableTurns(verts, 172) || getLapCount(verts) !== state.lapCount) return false;
                for (let i = 0; i < verts.length; i++)
                    for (let j = i + 1; j < verts.length; j++)
                        if (Math.hypot(verts[i].x - verts[j].x, verts[i].y - verts[j].y) < 50) return false;
                return true;
            }
            return isStrictlyConvexClockwise(verts);
        }

        function normalizeAngleSigned(angle) {
            while (angle <= -Math.PI) angle += 2 * Math.PI;
            while (angle > Math.PI) angle -= 2 * Math.PI;
            return angle;
        }

        function isStrictlyConvexClockwise(verts) {
            const n = verts.length;
            const minTurnRad = (15 * Math.PI) / 180;
            const maxTurnRad = (165 * Math.PI) / 180;
            const minEdgeLen = 70;

            for (let i = 0; i < n; i++) {
                const prev = verts[(i - 1 + n) % n];
                const curr = verts[i];
                const next = verts[(i + 1) % n];

                const len1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
                const len2 = Math.hypot(next.x - curr.x, next.y - curr.y);
                if (len1 < minEdgeLen || len2 < minEdgeLen) return false;

                const ang1 = Math.atan2(curr.y - prev.y, curr.x - prev.x);
                const ang2 = Math.atan2(next.y - curr.y, next.x - curr.x);
                const turn = normalizeAngleSigned(ang2 - ang1);

                if (turn < minTurnRad || turn > maxTurnRad) return false;
            }
            return true;
        }

        function computePolygonGeometry() {
            const n = state.vertices.length;
            const corners = [];

            for (let i = 0; i < n; i++) {
                const prev = state.vertices[(i - 1 + n) % n];
                const curr = state.vertices[i];
                const next = state.vertices[(i + 1) % n];

                const inAngle = Math.atan2(curr.y - prev.y, curr.x - prev.x);
                const outAngle = Math.atan2(next.y - curr.y, next.x - curr.x);

                // 꺾는 각(외각): 오른쪽(시계 방향)으로 돌면 +, 왼쪽으로 돌면 −
                const turnRad = normalizeAngleSigned(outAngle - inAngle);

                const exactDeg = (turnRad * 180) / Math.PI;
                corners.push({
                    index: i,
                    label: VERTEX_LETTERS[i],
                    vertex: curr,
                    prev: prev,
                    next: next,
                    inAngle: inAngle,
                    outAngle: outAngle,
                    turnRad: turnRad,
                    exactDeg: exactDeg,
                    displayDeg: Math.round(exactDeg),
                    interiorDeg: 180 - Math.round(exactDeg),
                    color: CORNER_COLORS[i % CORNER_COLORS.length]
                });
            }

            // 정수로 반올림한 외각의 합이 360° × (바퀴 수)가 되도록, 반올림 오차가 가장 큰 쪽부터 보정
            const target = getTurnTarget();
            let sum = corners.reduce((acc, c) => acc + c.displayDeg, 0);
            if (sum !== target && corners.length > 0) {
                const dir = Math.sign(target - sum);
                const order = [...corners].sort((p, q) => dir * ((q.exactDeg - q.displayDeg) - (p.exactDeg - p.displayDeg)));
                for (let k = 0; k < Math.abs(target - sum); k++) order[k % order.length].displayDeg += dir;
                corners.forEach(c => c.interiorDeg = 180 - c.displayDeg);
            }

            const cx = state.vertices.reduce((s, v) => s + v.x, 0) / n;
            const cy = state.vertices.reduce((s, v) => s + v.y, 0) / n;

            return { corners, centroid: { x: cx, y: cy } };
        }

        function getStartPointInfo() {
            const n = state.vertices.length;
            const vLast = state.vertices[n - 1];
            const vFirst = state.vertices[0];
            return {
                x: vLast.x * 0.65 + vFirst.x * 0.35,
                y: vLast.y * 0.65 + vFirst.y * 0.35,
                angle: Math.atan2(vFirst.y - vLast.y, vFirst.x - vLast.x)
            };
        }

        function syncStaticCarPose() {
            const { corners } = computePolygonGeometry();
            const n = corners.length;
            const prevSum = corners.slice(0, state.completedCorners).reduce((a, c) => a + c.displayDeg, 0);

            if (state.carStage === 'START_LINE') {
                const s = getStartPointInfo();
                state.carX = s.x;
                state.carY = s.y;
                state.carAngle = s.angle;
                state.currentCornerTurnDeg = 0;
                state.cumulativeTurnDeg = 0;
            } else if (state.carStage === 'WAITING_INPUT') {
                const c = corners[state.activeCornerIndex];
                state.carX = c.vertex.x;
                state.carY = c.vertex.y;
                state.carAngle = c.inAngle;
                state.currentCornerTurnDeg = 0;
                state.cumulativeTurnDeg = prevSum;
            } else if (state.carStage === 'TURN_WRONG') {
                const c = corners[state.activeCornerIndex];
                state.carX = c.vertex.x;
                state.carY = c.vertex.y;
                state.carAngle = c.inAngle + (state.currentCornerTurnDeg * Math.PI) / 180;
                state.cumulativeTurnDeg = prevSum + state.currentCornerTurnDeg;
            } else if (state.carStage === 'OFF_TRACK_STOP') {
                const c = corners[state.activeCornerIndex];
                const wrongRad = c.inAngle + (state.currentCornerTurnDeg * Math.PI) / 180;
                state.carX = c.vertex.x + state.offTrackDistance * Math.cos(wrongRad);
                state.carY = c.vertex.y + state.offTrackDistance * Math.sin(wrongRad);
                state.carAngle = wrongRad;
            } else if (state.carStage === 'TURN_CORRECT') {
                const c = corners[state.activeCornerIndex];
                state.carX = c.vertex.x;
                state.carY = c.vertex.y;
                state.carAngle = c.outAngle;
                state.currentCornerTurnDeg = c.displayDeg;
                state.cumulativeTurnDeg = prevSum;
            } else if (state.carStage === 'LAP_COMPLETE') {
                const s = getStartPointInfo();
                state.carX = s.x;
                state.carY = s.y;
                state.carAngle = s.angle;
                state.currentCornerTurnDeg = corners[n - 1].displayDeg;
                state.cumulativeTurnDeg = getTurnTarget();
            }
            updateDashboardUI();
        }

        // ============================================================================
        // 4. STEERING MODE & MANUAL / WRONG ANSWER CONTROLLERS
        // ============================================================================
        function setPolygonSides(n) {
            const minN = state.shapeMode === 'CONCAVE' ? 4 : MIN_SIDES;
            n = Math.max(minN, Math.min(MAX_SIDES, n));
            state.numSides = n;
            updateSidesLabel();
            initRegularPolygon(n);
        }

        function updateSidesLabel() {
            const label = document.getElementById('sides-label'), sub = document.getElementById('sides-sub');
            const minus = document.getElementById('btn-sides-minus'), plus = document.getElementById('btn-sides-plus');
            if (state.shapeMode === 'STAR') {
                const t = STAR_TYPES[state.starIndex];
                label.textContent = t.name;
                sub.textContent = `점 ${t.n}개 · ${t.k}칸씩`;
                minus.disabled = state.starIndex <= 0;
                plus.disabled = state.starIndex >= STAR_TYPES.length - 1;
            } else {
                const n = state.numSides;
                label.textContent = (state.shapeMode === 'CONCAVE' ? '오목 ' : '') + polyName(n);
                sub.textContent = `n = ${n}`;
                minus.disabled = n <= (state.shapeMode === 'CONCAVE' ? 4 : MIN_SIDES);
                plus.disabled = n >= MAX_SIDES;
            }
        }

        function changeSides(delta) {
            if (state.shapeMode === 'STAR') {
                state.starIndex = Math.max(0, Math.min(STAR_TYPES.length - 1, state.starIndex + delta));
                state.numSides = STAR_TYPES[state.starIndex].n;
                updateSidesLabel();
                initRegularPolygon(state.numSides);
            } else {
                setPolygonSides(state.numSides + delta);
            }
        }

        // ---------------------------------------------------------------------------
        // 응용 메뉴: 볼록 · 오목 · 별다각형
        // ---------------------------------------------------------------------------
        const SHAPE_OPTIONS = [
            { key: 'CONVEX', title: '기본 (볼록다각형)', desc: '모든 꼭짓점에서 오른쪽으로 돌아요 → 외각의 합 360°', color: '#0F172A' },
            { key: 'CONCAVE', title: '오목다각형', desc: '들어간 꼭짓점에서는 왼쪽으로 돌아요 → 그 외각은 −', color: '#EA580C' },
            { key: 'STAR', title: '별다각형', desc: '한 번 그리는 동안 두 바퀴 이상 돌아요 → 360° × 바퀴 수', color: '#7C3AED' }
        ];

        function renderShapeMenu() {
            document.getElementById('shape-menu-items').innerHTML = SHAPE_OPTIONS.map(o => {
                const on = state.shapeMode === o.key;
                return `<button onclick="setShapeMode('${o.key}')" class="w-full flex items-center gap-3 p-3 rounded-xl text-left border-2 mb-1 ${on ? 'bg-slate-50' : 'border-transparent hover:bg-slate-50'}" style="${on ? `border-color:${o.color}` : ''}">
                    <span class="w-3 h-10 rounded-full shrink-0" style="background:${o.color}; opacity:${on ? 1 : 0.3}"></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-base font-extrabold text-slate-900">${o.title}</span>
                        <span class="block text-xs font-semibold text-slate-500">${o.desc}</span>
                    </span>
                </button>`;
            }).join('');
            const btn = document.getElementById('btn-shape-menu');
            const cur = SHAPE_OPTIONS.find(o => o.key === state.shapeMode);
            if (state.shapeMode === 'CONVEX') {
                btn.className = "px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-1.5";
                btn.style.cssText = '';
                document.getElementById('text-shape-btn').textContent = '응용';
            } else {
                btn.className = "px-3 py-2 rounded-xl text-sm font-extrabold border-2 text-white transition-all flex items-center gap-1.5";
                btn.style.cssText = `background:${cur.color}; border-color:${cur.color}`;
                document.getElementById('text-shape-btn').textContent = state.shapeMode === 'STAR' ? '응용: 별' : '응용: 오목';
            }
            document.getElementById('left-turn-hint').classList.toggle('hidden', state.shapeMode !== 'CONCAVE');
            document.getElementById('text-reset-shape').textContent = state.shapeMode === 'CONVEX' ? '정다각형으로' : '처음 모양으로';
            document.getElementById('btn-general').classList.toggle('hidden', state.shapeMode !== 'CONVEX');
        }

        function setShapeMode(mode) {
            state.shapeMode = mode;
            document.getElementById('shape-menu').classList.add('hidden');
            if (mode === 'STAR') state.numSides = STAR_TYPES[state.starIndex].n;
            if (mode === 'CONCAVE' && state.numSides < 5) state.numSides = 5;
            renderShapeMenu();
            updateSidesLabel();
            initRegularPolygon(state.numSides);
        }

        function toggleShapeMenu(evt) {
            evt.stopPropagation();
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('shape-menu').classList.toggle('hidden');
        }
        document.addEventListener('click', () => document.getElementById('shape-menu').classList.add('hidden'));

        // ---------------------------------------------------------------------------
        // 칠판 모드 · 전체 화면
        // ---------------------------------------------------------------------------
        function applyBoardMode() {
            // 칠판 모드는 넓은 화면(가로 1024px 이상)에서만 적용
            const on = state.boardMode && window.innerWidth >= 1024;
            S = on ? Math.max(1, Math.min(1.7, window.innerWidth / 1370)) : 1;
            document.documentElement.classList.toggle('board', on);
            document.getElementById('btn-board').className = state.boardMode
                ? "hidden lg:flex px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-900 bg-slate-900 text-white transition-all items-center gap-1.5"
                : "hidden lg:flex px-3 py-2 rounded-xl text-sm font-bold border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all items-center gap-1.5";
            document.getElementById('text-board-btn').textContent = state.boardMode ? '칠판 모드 켜짐' : '칠판 모드';
        }

        function toggleBoardMode() {
            state.boardMode = !state.boardMode;
            try { localStorage.setItem('polygonLab.boardMode', state.boardMode ? '1' : '0'); } catch (e) {}
            applyBoardMode();
            requestAnimationFrame(() => { resizeCanvas(); initRegularPolygon(state.numSides); });
        }

        function toggleFullscreen() {
            try {
                const p = !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }

        // ---------------------------------------------------------------------------
        // 각도 보기 메뉴
        // ---------------------------------------------------------------------------
        const VIEW_OPTIONS = [
            { key: 'showExteriorNumbers', title: '외각의 크기', desc: '색칠한 외각 부채꼴 안의 숫자', swatch: '#F43F5E' },
            { key: 'showInteriorAngles', title: '내각과 그 크기', desc: '다각형 안쪽의 회색 부채꼴과 숫자', swatch: '#64748B' },
            { key: 'showAllAnglesAlways', title: '모든 외각 미리 보기', desc: '자동차가 돌기 전에 외각을 모두 표시', swatch: '#0EA5E9' }
        ];

        function renderViewMenu() {
            document.getElementById('view-menu-items').innerHTML = VIEW_OPTIONS.map(o => {
                const on = state[o.key];
                return `<button onclick="toggleView('${o.key}')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-left">
                    <span class="w-3 h-8 rounded-full shrink-0" style="background:${o.swatch}; opacity:${on ? 1 : 0.25}"></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-base font-extrabold ${on ? 'text-slate-900' : 'text-slate-400'}">${o.title}</span>
                        <span class="block text-xs font-semibold text-slate-500 truncate">${o.desc}</span>
                    </span>
                    <span class="relative w-11 h-6 rounded-full shrink-0 transition-all ${on ? 'bg-indigo-600' : 'bg-slate-300'}">
                        <span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all" style="left:${on ? '1.375rem' : '0.125rem'}"></span>
                    </span>
                </button>`;
            }).join('');
            const count = VIEW_OPTIONS.filter(o => state[o.key]).length;
            document.getElementById('view-count').textContent = count;
            document.getElementById('btn-view-menu').className = count > 0
                ? "px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all flex items-center gap-1.5"
                : "px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-300 bg-white text-slate-500 transition-all flex items-center gap-1.5";
        }

        function toggleView(key) {
            state[key] = !state[key];
            renderViewMenu();
            updateDashboardUI();
        }

        function setAllViews(on) {
            VIEW_OPTIONS.forEach(o => state[o.key] = on);
            renderViewMenu();
            updateDashboardUI();
        }

        // 연장선 보이기/숨기기
        function renderExtensionButton() {
            const on = state.showExtension;
            document.getElementById('btn-extension').className = on
                ? "py-3 px-3 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-extrabold text-sm transition-all flex items-center gap-1.5 shrink-0"
                : "py-3 px-3 rounded-xl border-2 border-slate-200 bg-white text-slate-500 hover:bg-slate-50 font-bold text-sm transition-all flex items-center gap-1.5 shrink-0";
            document.getElementById('text-extension').textContent = on ? '연장선 켜짐' : '연장선';
        }
        function toggleExtension() {
            state.showExtension = !state.showExtension;
            renderExtensionButton();
        }

        function toggleViewMenu(evt) {
            evt.stopPropagation();
            document.getElementById('view-menu').classList.toggle('hidden');
        }
        document.addEventListener('click', () => document.getElementById('view-menu').classList.add('hidden'));

        function resetToRegularPolygon() {
            initRegularPolygon(state.numSides);
        }

        function setSteeringMode(mode) {
            state.steeringMode = mode;
            const manualBtn = document.getElementById('mode-manual-btn');
            const autoBtn = document.getElementById('mode-auto-btn');
            const manualPanel = document.getElementById('manual-steering-panel');

            const onCls = "py-2 rounded-lg text-sm font-extrabold transition-all bg-white text-slate-900 shadow-sm flex items-center justify-center gap-1.5";
            const offCls = "py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5";
            if (mode === 'MANUAL') {
                manualBtn.className = onCls;
                autoBtn.className = offCls;
                manualPanel.classList.remove('hidden');
            } else {
                autoBtn.className = onCls;
                manualBtn.className = offCls;
                manualPanel.classList.add('hidden');

                // If currently waiting at a corner, automatically complete the turn
                if (state.carStage === 'WAITING_INPUT' || state.carStage === 'TURN_WRONG' || state.carStage === 'OFF_TRACK_STOP') {
                    snapToCorrectAngle();
                }
            }
            updateDashboardUI();
        }

        function resetCarSimulation() {
            state.carStage = 'START_LINE';
            state.activeCornerIndex = 0;
            state.completedCorners = 0;
            state.animProgress = 0;
            state.currentCornerTurnDeg = 0;
            state.cumulativeTurnDeg = 0;
            state.enteredAngleDeg = null;
            state.gatherRatio = 0;
            state.gatherAnimTarget = null;

            document.getElementById('gatherSlider').value = 0;
            document.getElementById('gatherValueLabel').textContent = '0%';
            document.getElementById('btn-gather-quick').textContent = '외각 모으기';
            document.getElementById('angleInput').value = '';
            document.getElementById('turn-feedback-box').classList.add('hidden');

            syncStaticCarPose();
        }

        // Primary Drive Action Button Handler
        function handlePrimaryDriveAction() {
            const { corners } = computePolygonGeometry();
            const n = corners.length;

            // Un-gather if gathered
            if (state.gatherRatio > 0) {
                state.gatherRatio = 0;
                state.gatherAnimTarget = null;
                document.getElementById('gatherSlider').value = 0;
                document.getElementById('gatherValueLabel').textContent = '0%';
            }

            if (state.carStage === 'LAP_COMPLETE') {
                resetCarSimulation();
                return;
            }

            // If at start line or finished turning previous corner -> Drive to next corner
            if (state.carStage === 'START_LINE' || state.carStage === 'TURN_CORRECT') {
                if (state.completedCorners >= n) {
                    // Drive back to start flag
                    state.carStage = 'RETURNING_HOME';
                    state.animProgress = 0;
                } else {
                    state.activeCornerIndex = state.completedCorners;
                    state.carStage = 'DRIVING_TO_V';
                    state.animProgress = 0;
                    state.currentCornerTurnDeg = 0;
                    document.getElementById('turn-feedback-box').classList.add('hidden');
                }
                updateDashboardUI();
                return;
            }

            // If waiting at corner and teacher clicks primary button, focus input or auto-turn
            if (state.carStage === 'WAITING_INPUT') {
                if (state.steeringMode === 'AUTO') {
                    snapToCorrectAngle();
                } else {
                    const inputEl = document.getElementById('angleInput');
                    if (inputEl.value.trim() !== '') {
                        submitManualAngle();
                    } else {
                        inputEl.focus();
                    }
                }
            }
        }

        function adjustAngleInput(delta) {
            if (state.carStage !== 'WAITING_INPUT' && state.carStage !== 'TURN_WRONG' && state.carStage !== 'OFF_TRACK_STOP') return;
            const inputEl = document.getElementById('angleInput');
            const currentVal = parseInt(inputEl.value, 10) || 0;
            const nextVal = Math.max(-360, Math.min(360, currentVal + delta));
            inputEl.value = nextVal;
        }

        // Quick preset to input the interior angle (common student misconception!)
        function setInputToInteriorWrong() {
            if (state.carStage !== 'WAITING_INPUT' && state.carStage !== 'TURN_WRONG' && state.carStage !== 'OFF_TRACK_STOP') return;
            const { corners } = computePolygonGeometry();
            const c = corners[state.activeCornerIndex];
            document.getElementById('angleInput').value = c.interiorDeg;
            submitManualAngle();
        }

        function submitManualAngle() {
            if (state.carStage !== 'WAITING_INPUT' && state.carStage !== 'TURN_WRONG' && state.carStage !== 'OFF_TRACK_STOP') {
                return;
            }

            const inputEl = document.getElementById('angleInput');
            let val = parseFloat(inputEl.value);
            if (isNaN(val)) return;
            val = Math.max(-360, Math.min(360, val));

            const { corners } = computePolygonGeometry();
            const c = corners[state.activeCornerIndex];

            // If car was off-track, snap back to vertex first before turning
            state.carX = c.vertex.x;
            state.carY = c.vertex.y;
            state.offTrackDistance = 0;

            state.turnStartDeg = state.currentCornerTurnDeg;
            state.turnTargetDeg = val;
            state.enteredAngleDeg = Math.round(val);
            state.isTargetAngleCorrect = Math.abs(val - c.displayDeg) <= 1;
            state.carStage = 'TURNING';
            state.animProgress = 0;
            updateDashboardUI();
        }

        function snapToCorrectAngle() {
            const { corners } = computePolygonGeometry();
            const c = corners[state.activeCornerIndex];
            document.getElementById('angleInput').value = c.displayDeg;
            state.carX = c.vertex.x;
            state.carY = c.vertex.y;
            state.offTrackDistance = 0;

            state.turnStartDeg = state.currentCornerTurnDeg;
            state.turnTargetDeg = c.displayDeg;
            state.enteredAngleDeg = c.displayDeg;
            state.isTargetAngleCorrect = true;
            state.carStage = 'TURNING';
            state.animProgress = 0;
            updateDashboardUI();
        }

        function triggerOffTrackDrive() {
            const { corners } = computePolygonGeometry();
            const c = corners[state.activeCornerIndex];

            if (state.carStage === 'TURN_WRONG') {
                state.carStage = 'DRIVING_OFF';
                state.animProgress = 0;
            } else if (state.carStage === 'OFF_TRACK_STOP') {
                // Return car back to the vertex
                state.carX = c.vertex.x;
                state.carY = c.vertex.y;
                state.offTrackDistance = 0;
                state.carStage = 'TURN_WRONG';
            }
            updateDashboardUI();
        }

        function onGatherSliderChange(val) {
            state.gatherAnimTarget = null;
            state.gatherRatio = parseFloat(val) / 100;
            document.getElementById('gatherValueLabel').textContent = `${Math.round(val)}%`;
            document.getElementById('btn-gather-quick').textContent = state.gatherRatio > 0.9 ? '원래대로' : '외각 모으기';
            updateDashboardUI();
        }

        function toggleGatherPeak() {
            state.gatherAnimTarget = state.gatherRatio < 0.5 ? 1.0 : 0.0;
        }

        // ============================================================================
        // 5. DASHBOARD UI UPDATER
        // ============================================================================
        function updateDashboardUI() {
            const { corners } = computePolygonGeometry();
            const n = corners.length;
            const activeCorner = corners[Math.min(state.activeCornerIndex, n - 1)];

            // 1. Primary Drive Button State
            const driveBtn = document.getElementById('btn-drive-corner');
            const driveText = document.getElementById('text-drive-corner');

            if (state.carStage === 'START_LINE') {
                driveBtn.disabled = false;
                driveBtn.className = "flex-1 py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-base transition-all flex items-center justify-center gap-2";
                driveText.textContent = `코너 A로 이동`;
            } else if (state.carStage === 'WAITING_INPUT' || state.carStage === 'TURN_WRONG' || state.carStage === 'OFF_TRACK_STOP') {
                driveBtn.disabled = false;
                driveBtn.className = "flex-1 py-3 px-4 rounded-xl bg-slate-200 text-slate-600 font-extrabold text-base transition-all flex items-center justify-center gap-2";
                driveText.textContent = `코너 ${activeCorner.label} 조향 대기 중`;
            } else if (state.carStage === 'TURN_CORRECT') {
                driveBtn.disabled = false;
                driveBtn.className = "flex-1 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-base transition-all flex items-center justify-center gap-2";
                if (state.completedCorners < n) {
                    const nextC = corners[state.completedCorners];
                    driveText.textContent = `다음 코너 ${nextC.label}로 이동`;
                } else {
                    driveText.textContent = `출발선으로 복귀 (완주)`;
                }
            } else if (state.carStage === 'LAP_COMPLETE') {
                driveBtn.disabled = false;
                driveBtn.className = "flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-base transition-all flex items-center justify-center gap-2";
                driveText.textContent = `${getTurnTarget()}° 완주 완료 (다시 시작)`;
            }

            // 2. Manual Steering Box State
            const manualPanel = document.getElementById('manual-steering-panel');
            const vertexDot = document.getElementById('active-vertex-dot');
            const panelTitle = document.getElementById('manual-panel-title');
            const intBadge = document.getElementById('interior-hint-badge');
            const presetIntBtn = document.getElementById('btn-preset-interior');
            const feedbackBox = document.getElementById('turn-feedback-box');

            vertexDot.style.backgroundColor = activeCorner.color.hex;
            intBadge.textContent = `내각 ${activeCorner.interiorDeg}°`;
            intBadge.className = "text-base font-extrabold font-mono-num px-2.5 py-0.5 rounded-lg bg-blue-100 text-blue-800 border border-blue-200";
            presetIntBtn.textContent = `내각(${activeCorner.interiorDeg}°)`;

            const isAtCornerForInput = (state.carStage === 'WAITING_INPUT' || state.carStage === 'TURN_WRONG' || state.carStage === 'OFF_TRACK_STOP' || state.carStage === 'TURNING');

            if (isAtCornerForInput) {
                manualPanel.className = "p-3.5 rounded-2xl border-2 border-blue-500 bg-blue-50/40 space-y-2.5 transition-all";
                panelTitle.textContent = `코너 ${activeCorner.label} 회전각 입력`;
            } else {
                manualPanel.className = "p-3.5 rounded-2xl border-2 border-slate-200 bg-slate-50/60 space-y-2.5 opacity-60 transition-all";
                panelTitle.textContent = `코너 이동 후 입력 가능`;
            }

            // 3. Wrong / Correct Feedback Sub-panel
            if (state.carStage === 'TURN_WRONG' || state.carStage === 'DRIVING_OFF' || state.carStage === 'OFF_TRACK_STOP') {
                feedbackBox.classList.remove('hidden');
                const diff = state.enteredAngleDeg - activeCorner.displayDeg;
                // 돌아야 할 방향과 반대로 돈 경우를 따로 알려 줌
                const wrongDir = Math.sign(state.enteredAngleDeg) !== Math.sign(activeCorner.displayDeg) && state.enteredAngleDeg !== 0;
                const diffText = wrongDir
                    ? (activeCorner.displayDeg < 0 ? '왼쪽으로 돌아야 해요' : '오른쪽으로 돌아야 해요')
                    : (Math.abs(state.enteredAngleDeg) < Math.abs(activeCorner.displayDeg) ? `${Math.abs(diff)}° 덜 돎` : `${Math.abs(diff)}° 더 돎`);

                document.getElementById('feedback-status-text').className = "text-base font-extrabold text-rose-600";
                document.getElementById('feedback-status-text').textContent = `길에서 벗어나요! (${state.enteredAngleDeg}°)`;

                const diffBadge = document.getElementById('feedback-diff-badge');
                diffBadge.className = "text-sm font-mono-num font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-700";
                diffBadge.textContent = diffText;

                document.getElementById('wrong-action-buttons').classList.remove('hidden');
                document.getElementById('text-snap-correct').textContent = `정답(${activeCorner.displayDeg}°)으로 바로잡기`;

                const offBtnText = document.getElementById('text-offtrack');
                if (state.carStage === 'OFF_TRACK_STOP') {
                    offBtnText.textContent = `원래 코너(${activeCorner.label}) 복귀`;
                } else {
                    offBtnText.textContent = `이 방향 그대로 직진`;
                }
            } else if (state.carStage === 'TURN_CORRECT') {
                feedbackBox.classList.remove('hidden');
                document.getElementById('feedback-status-text').className = "text-base font-extrabold text-emerald-700";
                document.getElementById('feedback-status-text').textContent = `외각만큼 정확히 돌았어요! (${activeCorner.displayDeg}°)`;

                const diffBadge = document.getElementById('feedback-diff-badge');
                diffBadge.className = "text-sm font-mono-num font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800";
                diffBadge.textContent = `180° − ${activeCorner.interiorDeg}°`;

                document.getElementById('wrong-action-buttons').classList.add('hidden');
            } else {
                feedbackBox.classList.add('hidden');
            }

            // 4. Steering Wheel & Gauges
            document.getElementById('steering-wheel-svg').style.transform = `rotate(${state.cumulativeTurnDeg}deg)`;
            document.getElementById('current-turn-angle').textContent = `${Math.round(state.currentCornerTurnDeg)}°`;

            const target = getTurnTarget();
            const displayTotal = (state.showAllAnglesAlways || state.gatherRatio > 0.05 || state.completedCorners === n)
                ? target
                : Math.round(state.cumulativeTurnDeg);
            document.getElementById('gauge-denominator').textContent = `/ ${target}°`;

            document.getElementById('cumulative-turn-angle').textContent = `${displayTotal}°`;
            document.getElementById('gauge-center-num').textContent = `${displayTotal}°`;
            document.getElementById('corner-progress-badge').textContent = `${state.completedCorners} / ${n} 완료`;

            renderPizzaGaugeSVG(corners);
            renderEquationPills(corners);
        }

        // 누적 회전 게이지: 바퀴마다 안쪽 띠로, 왼쪽으로 돈 각(−)은 지워지는 모양으로
        function renderPizzaGaugeSVG(corners) {
            const group = document.getElementById('pizza-wedges-group');
            group.innerHTML = '';
            const showFull = state.showAllAnglesAlways || state.gatherRatio > 0.05;
            const laps = Math.max(1, state.lapCount);
            const bw = 20 / laps; // 바퀴 하나의 띠 두께 (바깥 반지름 42 ~ 안쪽 22)

            const pieces = [];
            let cum = 0;
            corners.forEach((c, i) => {
                let deg = 0;
                if (showFull || i < state.completedCorners) deg = c.exactDeg;
                else if (i === state.activeCornerIndex && state.carStage === 'TURNING' && state.isTargetAngleCorrect)
                    deg = c.exactDeg * easeInOutCubic(state.animProgress);
                if (Math.abs(deg) > 0.2) pieces.push({ from: Math.min(cum, cum + deg), to: Math.max(cum, cum + deg), neg: deg < 0, color: c.color.hex });
                cum += c.exactDeg;
            });

            // 양수(오른쪽) 먼저, 음수(왼쪽, 되돌아간 부분)를 위에
            [...pieces.filter(p => !p.neg), ...pieces.filter(p => p.neg)].forEach(p => {
                let a = Math.max(0, p.from);
                while (a < p.to - 0.01) {
                    const lap = Math.floor(a / 360 + 1e-9);
                    const end = Math.min(p.to, (lap + 1) * 360);
                    const outer = 42 - Math.min(lap, laps - 1) * bw, inner = outer - bw;
                    group.appendChild(createSvgAnnulusSlice(50, 50, outer, inner, a - lap * 360, end - lap * 360, p.neg ? 'rgba(255,255,255,0.85)' : p.color, p.neg ? p.color : '#FFFFFF', p.neg));
                    a = end;
                }
            });
        }

        function createSvgAnnulusSlice(cx, cy, r1, r0, startDeg, endDeg, fill, stroke, dashed) {
            const rad = d => (d * Math.PI) / 180;
            const pt = (r, d) => `${cx + r * Math.cos(rad(d))} ${cy + r * Math.sin(rad(d))}`;
            const large = endDeg - startDeg > 180 ? 1 : 0;
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${pt(r1, startDeg)} A ${r1} ${r1} 0 ${large} 1 ${pt(r1, endDeg)} L ${pt(r0, endDeg)} A ${r0} ${r0} 0 ${large} 0 ${pt(r0, startDeg)} Z`);
            path.setAttribute('fill', fill);
            path.setAttribute('stroke', stroke);
            path.setAttribute('stroke-width', dashed ? '1.8' : '1.2');
            if (dashed) path.setAttribute('stroke-dasharray', '3 2');
            return path;
        }

        function renderEquationPills(corners) {
            const container = document.getElementById('angle-pills-container');
            const showFull = state.showAllAnglesAlways || state.gatherRatio > 0.05;
            let html = '';
            let visibleSum = 0;

            corners.forEach((c, idx) => {
                const isRevealed = showFull || idx < state.completedCorners;
                if (isRevealed) {
                    visibleSum += c.displayDeg;
                    html += c.displayDeg < 0
                        ? `<span class="px-2 py-1 rounded-lg font-mono-num text-sm font-extrabold flex items-center gap-1 border-2 border-dashed bg-white" style="border-color:${c.color.hex}; color:${c.color.badgeText};">
                            <span>${c.label}</span><span>(${c.displayDeg}°)</span></span>`
                        : `<span class="px-2 py-1 rounded-lg font-mono-num text-sm font-extrabold text-white flex items-center gap-1" style="background-color: ${c.color.hex};">
                            <span>${c.label}</span><span>${c.displayDeg}°</span></span>`;
                } else {
                    html += `<span class="px-2 py-1 rounded-lg font-mono-num text-sm font-bold text-slate-400 border-2 border-dashed border-slate-600">${c.label} ?°</span>`;
                }
                if (idx < corners.length - 1) html += `<span class="text-slate-400 font-bold text-sm">+</span>`;
            });

            const isAllDone = showFull || state.completedCorners === corners.length;
            const target = getTurnTarget();
            const totalText = isAllDone ? (state.lapCount > 1 ? `360° × ${state.lapCount} = ${target}°` : '360°') : `${visibleSum}°`;
            html += `<span class="text-slate-300 font-extrabold text-base">=</span>
                <span class="px-2.5 py-1 rounded-lg font-mono-num text-xl font-extrabold ${isAllDone ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-white'}">${totalText}</span>`;
            container.innerHTML = html;

            // 내각의 합 = 180° × n − 외각의 합 (볼록·오목·별 모두 성립)
            const n = corners.length;
            document.getElementById('interior-sum-line').innerHTML = isAllDone
                ? `${state.shapeMode === 'STAR' ? '별 꼭짓점 각의 합' : '내각의 합'} = 180° × ${n} − ${target}° = <span class="text-amber-300 text-base">${180 * n - target}°</span>`
                : `${state.shapeMode === 'STAR' ? '별 꼭짓점 각의 합' : '내각의 합'} = 180° × ${n} − (외각의 합)`;
        }

        // ============================================================================
        // 6. VERTEX DRAGGING INTERACTION
        // ============================================================================
        function getPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', (e) => onPointerDown(e), { passive: false });
        canvas.addEventListener('touchmove', (e) => onPointerMove(e), { passive: false });
        window.addEventListener('touchend', onPointerUp);

        function onPointerDown(evt) {
            const pos = getPointerPos(evt);
            for (let i = 0; i < state.vertices.length; i++) {
                const v = state.vertices[i];
                if (Math.hypot(pos.x - v.x, pos.y - v.y) <= 26 * S) {
                    state.draggingVertexIndex = i;
                    if (evt.cancelable) evt.preventDefault();
                    return;
                }
            }
        }

        function onPointerMove(evt) {
            const pos = getPointerPos(evt);
            const { w, h } = getCanvasSize();

            if (state.draggingVertexIndex !== -1) {
                if (evt.cancelable) evt.preventDefault();
                const idx = state.draggingVertexIndex;
                const oldVertex = { ...state.vertices[idx] };

                const pad = 40 * S;
                state.vertices[idx] = {
                    x: Math.max(pad, Math.min(w - pad, pos.x)),
                    y: Math.max(pad, Math.min(h - pad, pos.y))
                };

                if (!isValidShape(state.vertices)) {
                    state.vertices[idx] = oldVertex;
                } else {
                    syncStaticCarPose();
                }
                return;
            }

            let foundHover = -1;
            for (let i = 0; i < state.vertices.length; i++) {
                if (Math.hypot(pos.x - state.vertices[i].x, pos.y - state.vertices[i].y) <= 26 * S) {
                    foundHover = i;
                    break;
                }
            }
            state.hoveredVertexIndex = foundHover;
            canvas.style.cursor = foundHover !== -1 ? 'pointer' : 'grab';
        }

        function onPointerUp() {
            state.draggingVertexIndex = -1;
        }

        // ============================================================================
        // 7. ANIMATION ENGINE
        // ============================================================================
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        let lastTime = performance.now();

        function animateLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updateSimState(dt);
            renderCanvasScene();

            requestAnimationFrame(animateLoop);
        }

        function updateSimState(dt) {
            // 1. Gather slider animation
            if (state.gatherAnimTarget !== null) {
                const speed = 1.9 * dt;
                if (Math.abs(state.gatherRatio - state.gatherAnimTarget) <= speed) {
                    state.gatherRatio = state.gatherAnimTarget;
                    state.gatherAnimTarget = null;
                } else {
                    state.gatherRatio += Math.sign(state.gatherAnimTarget - state.gatherRatio) * speed;
                }
                const pct = Math.round(state.gatherRatio * 100);
                document.getElementById('gatherSlider').value = pct;
                document.getElementById('gatherValueLabel').textContent = `${pct}%`;
                document.getElementById('btn-gather-quick').textContent = state.gatherRatio > 0.9 ? '원래대로' : '외각 모으기';
                updateDashboardUI();
            }

            const { corners } = computePolygonGeometry();
            const n = corners.length;
            const c = corners[Math.min(state.activeCornerIndex, n - 1)];
            const prevSum = corners.slice(0, state.completedCorners).reduce((a, item) => a + item.displayDeg, 0);

            // 2. Stage Transitions
