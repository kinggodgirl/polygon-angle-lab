    <!-- 글꼴: 인터넷이 없으면 맑은 고딕 / Consolas로 자동 대체 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap">
    <style>
        * {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }
        /* 수업용 밝은 화면 하나로 고정 (어두운 테마에서도 같은 모습) */
        :root { color-scheme: light; --page-bg: #F8FAFC; --ink: #0F172A; }
        html, body { height: 100%; }
        body { background: var(--page-bg); color: var(--ink); }
        @media (max-width: 1023px) { html, body { height: auto; } }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        button:focus-visible, input:focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
        /* 칠판 모드: 화면 전체 글자·버튼을 키움 (rem 기준) */
        html { font-size: 16px; }
        html.board { font-size: clamp(15px, 1.04vw, 24px); }
        .section-label { font-size: 0.75rem; font-weight: 800; color: #475569; letter-spacing: 0.02em; }
        .icon { display: inline-block; flex-shrink: 0; }
        #modal-backdrop { background: rgba(15, 23, 42, 0.55); }
        .choice-btn { transition: transform .12s ease, background-color .15s ease, border-color .15s ease; }
        .choice-btn:active { transform: scale(0.97); }
        .rule-cell { cursor: pointer; }
        .rule-cell.hidden-val { color: #64748B; background: repeating-linear-gradient(45deg, #E2E8F0 0 8px, #F1F5F9 8px 16px); }
        .bg-math-grid {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(#CBD5E1 1.25px, transparent 1.25px),
                linear-gradient(to right, rgba(226, 232, 240, 0.55) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.55) 1px, transparent 1px);
            background-size: 24px 24px, 96px 96px, 96px 96px;
            background-position: -1px -1px;
        }
        input[type=range].gather-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #E2E8F0;
            border-radius: 999px;
            outline: none;
        }
        input[type=range].gather-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;
            background: #0F172A;
            cursor: pointer;
            border: 3px solid #FFFFFF;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.25);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type=range].gather-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #2563EB;
        }
        @keyframes pulseBorder {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .pulse-highlight {
            animation: pulseBorder 1.6s infinite ease-in-out;
        }
    </style>

</head>
<body style="margin:0">
<div id="app" class="lg:h-full w-full lg:overflow-hidden bg-slate-50 text-slate-900 flex flex-col">

    <!-- Top Toolbar -->
    <header class="xl:h-14 bg-white border-b border-slate-200 px-4 py-2 xl:py-0 flex flex-wrap items-center justify-between gap-2 xl:gap-3 shrink-0 z-20">
        <!-- Left: Title & Polygon Selector -->
        <div class="flex flex-wrap items-center gap-2 xl:gap-3 min-w-0">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center">
                    <i data-lucide="shapes" class="w-4 h-4"></i>
                </div>
                <span class="hidden min-[1800px]:inline font-extrabold text-base tracking-tight text-slate-900">다각형 내각의 합 탐구실</span>
            </div>

            <!-- n각형 선택 (3 ~ 12) -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                <button onclick="changeSides(-1)" id="btn-sides-minus" title="변의 수 줄이기" class="w-9 h-9 rounded-lg bg-white text-slate-900 font-extrabold text-xl leading-none shadow-sm hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-30 disabled:shadow-none">−</button>
                <div class="px-2 min-w-[8.5rem] text-center leading-tight">
                    <div id="sides-label" class="text-base font-extrabold text-slate-900">오각형</div>
                    <div id="sides-sub" class="text-xs font-bold text-slate-500 font-mono-num">n = 5</div>
                </div>
                <button onclick="changeSides(1)" id="btn-sides-plus" title="변의 수 늘리기" class="w-9 h-9 rounded-lg bg-white text-slate-900 font-extrabold text-xl leading-none shadow-sm hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-30 disabled:shadow-none">+</button>
            </div>

            <button onclick="resetToRegularPolygon()" class="shrink-0 px-3 py-2 rounded-xl text-sm font-bold border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center gap-1.5">
                <i data-lucide="layout-grid" class="w-4 h-4 text-slate-500"></i>
                <span class="hidden sm:inline">정다각형으로</span>
            </button>

            <!-- 오목다각형 허용 스위치 -->
            <button onclick="toggleConcave()" id="btn-concave" title="끄면 볼록다각형만 만들 수 있어요" class="shrink-0 pl-2 pr-3 py-2 rounded-xl text-sm font-bold border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-2">
                <span id="switch-concave" class="relative w-9 h-5 rounded-full bg-slate-300 transition-all"><span class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-all"></span></span>
                <span>오목다각형</span>
            </button>
        </div>

        <!-- Right: 보기 설정 · 탐구 도구 · 화면 설정 -->
        <div class="flex flex-wrap items-center gap-2 min-w-0 xl:shrink-0">
            <div class="relative">
                <button onclick="toggleViewMenu(event)" id="btn-view-menu" class="px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all flex items-center gap-1.5">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                    <span>각도 보기</span>
                    <span id="view-count" class="ml-0.5 px-1.5 rounded-md bg-indigo-600 text-white text-xs font-mono-num">2</span>
                </button>
                <!-- 보기 설정 메뉴 -->
                <div id="view-menu" class="hidden fixed left-4 right-4 top-28 md:absolute md:left-auto md:right-0 md:top-full md:mt-2 md:w-[22rem] bg-white border-2 border-slate-200 rounded-2xl shadow-2xl p-2 z-40" onclick="event.stopPropagation()">
                    <div id="view-menu-items"></div>
                    <div class="flex gap-2 p-2 pt-3 mt-1 border-t border-slate-100">
                        <button onclick="setAllViews(false)" class="flex-1 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-700 hover:bg-slate-50">숫자 모두 끄기</button>
                        <button onclick="setAllViews(true)" class="flex-1 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-700 hover:bg-slate-50">모두 켜기</button>
                    </div>
                </div>
            </div>
            <div class="hidden lg:block h-6 w-px bg-slate-200 mx-1"></div>
            <button onclick="openHelp()" class="px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-1.5">
                <i data-lucide="info" class="w-4 h-4"></i>
                <span>사용법</span>
            </button>
            <button onclick="openRuleModal()" class="px-3 py-2 rounded-xl text-sm font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white transition-all flex items-center gap-1.5 active:scale-95">
                <i data-lucide="table" class="w-4 h-4"></i>
                <span>규칙 찾기</span>
            </button>
            <button onclick="openQuiz()" class="px-3 py-2 rounded-xl text-sm font-extrabold bg-amber-500 hover:bg-amber-600 text-white transition-all flex items-center gap-1.5 active:scale-95">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
                <span>확인 문제</span>
            </button>
            <div class="hidden lg:block h-6 w-px bg-slate-200 mx-1"></div>
            <button onclick="toggleBoardMode()" id="btn-board" title="전자칠판용 큰 화면" class="hidden lg:flex px-3 py-2 rounded-xl text-sm font-extrabold border-2 transition-all flex items-center gap-1.5">
                <i data-lucide="monitor" class="w-4 h-4"></i>
                <span id="text-board-btn">칠판 모드</span>
            </button>
            <button onclick="toggleFullscreen()" title="전체 화면" class="hidden lg:block p-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main 70:30 Split Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row lg:overflow-hidden">
        
        <!-- LEFT 70%: Interactive Canvas Stage -->
        <section class="w-full lg:w-[66%] xl:w-[70%] h-[80svh] min-h-[36rem] lg:h-full relative bg-math-grid flex flex-col justify-between p-3 md:p-4 select-none overflow-hidden">
            
            <!-- Canvas -->
            <canvas id="simCanvas" class="absolute inset-0 w-full h-full cursor-pointer"></canvas>

            <!-- Top Context Info & Vertex Inspector Card -->
            <div id="canvas-top-row" class="relative z-10 flex flex-wrap items-start justify-between gap-2 md:gap-3 pointer-events-none">
                <!-- Mode & Vertex Relation Realtime Callout -->
                <div class="space-y-1.5 pointer-events-auto min-w-0">
                    <div class="bg-white/95 border border-slate-200 rounded-xl px-3 py-1.5 shadow-sm flex items-center gap-2.5 flex-wrap">
                        <span id="canvas-mode-badge" class="px-2 py-0.5 rounded-md bg-slate-900 text-white text-sm font-extrabold">꼭짓점 A 기준</span>
                        <span id="canvas-hint" class="hidden md:inline text-sm text-slate-600 font-semibold">꼭짓점을 끌어 모양을 바꾸거나, 눌러서 기준 꼭짓점을 바꿔 보세요</span>
                    </div>

                    <!-- 오목다각형에서 나눌 수 없을 때 등 안내 -->
                    <div id="canvas-warning" class="hidden bg-rose-600 text-white rounded-xl px-3 py-2 text-sm md:text-base font-extrabold shadow-lg"></div>

                    <!-- 각 분해 보기를 끈 상태에서만 보이는 꼭짓점 수식 카드 (켠 상태에서는 그림 위 말풍선이 같은 역할) -->
                    <div id="vertex-focus-card" class="hidden bg-indigo-900/95 text-white border border-indigo-700/80 rounded-xl px-3.5 py-2 shadow-lg flex items-center gap-3 transition-all">
                        <div class="w-7 h-7 rounded-lg bg-indigo-500 text-white flex items-center justify-center font-extrabold text-sm" id="vertex-focus-badge">A</div>
                        <div class="text-sm">
                            <span class="text-indigo-200 font-bold" id="vertex-focus-title">다각형의 꼭짓점 ∠A의 크기:</span>
                            <span class="font-extrabold font-mono-num text-amber-300 ml-1.5 text-base" id="vertex-focus-math">∠A₁ + ∠A₂ + ∠A₃ = 108°</span>
                        </div>
                    </div>
                </div>

                <!-- Gather Target Mode Switch -->
                <div class="bg-white/95 border border-slate-200 rounded-xl p-1 shadow-sm pointer-events-auto flex items-center gap-1 shrink-0">
                    <button onclick="setGatherLayout('TRAY')" id="layout-tray-btn" class="px-2 md:px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-extrabold bg-slate-900 text-white transition-all">
                        아래 받침대에 모으기
                    </button>
                    <button onclick="setGatherLayout('CENTROID')" id="layout-centroid-btn" class="px-2 md:px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-bold text-slate-600 hover:text-slate-900 transition-all">
                        삼각형 안에 모으기
                    </button>
                </div>
            </div>

            <!-- Bottom Floating: 180° 하나씩 모으기 컨트롤러 -->
            <div class="relative z-10 flex items-end justify-end gap-4 pointer-events-none">
                <div id="gather-panel" class="bg-white/95 border-2 border-slate-900 rounded-2xl p-2.5 md:p-3 shadow-xl pointer-events-auto flex flex-col gap-2 w-full md:w-[26rem]">

                    <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-2">
                        <span class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
                            <i data-lucide="pie-chart" class="w-4 h-4 text-blue-600"></i>
                            <span>세 각을 모아 180° 만들기</span>

    <!-- 규칙 찾기 / 확인 문제 공용 창 -->
    <div id="modal-backdrop" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6" onclick="if (event.target === this) closeModal()">

    <script>
        // ============================================================================
        // 0. 아이콘 (인터넷 없이 동작하도록 SVG를 파일 안에 포함)
        // ============================================================================
        const ICONS = {
            'shapes': '<path d="M8.3 10a.7.7 0 0 1-.63-1.08L11.4 3a.7.7 0 0 1 1.2-.04L16.3 8.9a.7.7 0 0 1-.57 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>',
            'layout-grid': '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
            'sparkles': '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
            'pie-chart': '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
            'corner-down-right': '<polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/>',
            'zap': '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
            'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
            'link-2': '<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/>',
            'play': '<polygon points="6 3 20 12 6 21 6 3"/>',
            'maximize': '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
            'monitor': '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
            'table': '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
            'help-circle': '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
            'x': '<path d="M18 6 6 18M6 6l12 12"/>',
            'info': '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
            'eye': '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
            'eye-off': '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>',
            'arrow-right': '<path d="M5 12h14M13 6l6 6-6 6"/>'
        };
        function renderIcons() {
            document.querySelectorAll('i[data-lucide]').forEach(el => {
                const name = el.getAttribute('data-lucide');
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('stroke-width', '2.2');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                svg.setAttribute('class', 'icon ' + (el.getAttribute('class') || ''));
                svg.innerHTML = ICONS[name] || '';
                el.replaceWith(svg);
            });
        }
        // 기존 코드의 lucide.createIcons() 호출을 그대로 쓸 수 있도록 연결
        const lucide = { createIcons: renderIcons };
        lucide.createIcons();

        // ============================================================================
        // 1. CONSTANTS & PALETTE
        // ============================================================================
        const MIN_SIDES = 3, MAX_SIDES = 12;
        const VERTEX_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
        const KOR_DIGITS = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
        function polyName(n) {
            const tens = Math.floor(n / 10), ones = n % 10;
            let s = '';
            if (tens > 0) s += (tens > 1 ? KOR_DIGITS[tens] : '') + '십';
            s += KOR_DIGITS[ones];
            return s + '각형';
        }

        function hexToRgba(hex, a) {
            const v = parseInt(hex.slice(1), 16);
            return `rgba(${(v >> 16) & 255}, ${(v >> 8) & 255}, ${v & 255}, ${a})`;
        }
        // 삼각형 최대 12개(내부 한 점 · 십이각형)까지 구분되는 색
        const TRI_PALETTE = [
            ['#F43F5E', '#E11D48'], ['#F59E0B', '#B45309'], ['#10B981', '#047857'], ['#0EA5E9', '#0369A1'],
            ['#8B5CF6', '#6D28D9'], ['#EC4899', '#BE185D'], ['#6366F1', '#4338CA'], ['#84CC16', '#4D7C0F'],
            ['#F97316', '#C2410C'], ['#06B6D4', '#0E7490'], ['#D946EF', '#A21CAF'], ['#A16207', '#854D0E']
        ].map(([hex, textHex], i) => ({
            id: `T${i + 1}`, hex, textHex,
            fill: hexToRgba(hex, 0.16), boardFill: hexToRgba(hex, 0.28),
            activeFill: hexToRgba(hex, 0.32), wedgeFill: hexToRgba(hex, 0.9)
        }));

        // 칠판 모드 배율 (캔버스 글자·선·점 크기)
        let S = 1;
        const monoFont = (px) => `800 ${Math.round(px * S)}px "JetBrains Mono", Consolas, monospace`;

        // ============================================================================
        // 2. APPLICATION STATE
        // ============================================================================
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            numSides: 5,
            vertices: [],
            centerPoint: { x: 0, y: 0 },

            triMode: 'VERTEX', // 'VERTEX' | 'MANUAL' | 'CENTER'
            baseVertexIndex: 0,
            manualDiagonals: [],
            manualSelectedVertex: -1,
            excludeCenterAngles: true,

            selectedTriIndices: new Set(),

            // 시각화 개선 옵션
            showVertexBreakdown: true, // 꼭짓점별 내각 분할 관계 강조
            showTotalVertexLabels: false, // 다각형 꼭짓점 바깥에 내각 크기 배지
            showTriangleAngles: true, // 꼭짓점 주변 삼각형 조각의 각도 숫자
            allowConcave: false, // 오목다각형 허용
            boardMode: true, // 전자칠판용 큰 화면
            focusedVertexIdx: 0, // 현재 하이라이트된 꼭짓점 (기본 A)

            // 조각 모으기 (Step-by-step)
            gatherLayout: 'TRAY', // 'TRAY' | 'CENTROID'
            targetTriForStep: 0, // 단계별 모으기 대상 삼각형
            stepWedgeCount: 0, // 현재 대상 삼각형에서 모인 조각 개수 (0, 1, 2, 3)
            wedgeAnimProgress: {}, // 개별 조각별(tIdx_cIdx) 애니메이션 진행도 (0 ~ 1)
            gatherSliderValue: 0,

            // 인터랙션
            draggingVertexIndex: -1,
            draggingCenterPoint: false,
            hoveredVertexIndex: -1,
            hoveredTriIndex: -1,
            pointerDownPos: null,
            hasDragged: false
        };

        // ============================================================================
        // 3. GEOMETRY & TRIANGULATION ENGINE
        // ============================================================================
        function getCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            return { w: canvas.width / dpr, h: canvas.height / dpr };
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const oldW = canvas.width / dpr || rect.width;
            const oldH = canvas.height / dpr || rect.height;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (state.vertices.length === 0) {
                initRegularPolygon(state.numSides);
            } else if (oldW > 0 && oldH > 0) {
                const dx = (rect.width - oldW) / 2;
                const dy = (rect.height - oldH) / 2;
                state.vertices.forEach(v => { v.x += dx; v.y += dy; });
                state.centerPoint.x += dx;
                state.centerPoint.y += dy;
            }
        }

        window.addEventListener('resize', () => {
            const oldS = S;
            if (typeof applyBoardMode === 'function') applyBoardMode();
            resizeCanvas();
            // 크기 배율이 바뀌면(전체 화면 전환 등) 다각형을 새 화면에 맞게 다시 배치
            if (Math.abs(S - oldS) > 0.01) initRegularPolygon(state.numSides);
        });

        // 캔버스 위에 떠 있는 패널들의 위치 (그림이 패널 밑에 가려지지 않게)
        function getOverlayRects() {
            const cr = canvas.getBoundingClientRect();
            const top = document.getElementById('canvas-top-row').getBoundingClientRect();
            const gp = document.getElementById('gather-panel').getBoundingClientRect();
            return { topSafe: top.bottom - cr.top + 8, panelLeft: gp.left - cr.left, panelTop: gp.top - cr.top };
        }

        // 아래 받침대(180° 반원 자리) 배치: 삼각형이 많으면 두 줄로
        function trayLayout(count) {
            const { w, h } = getCanvasSize();
            const ov = getOverlayRects();
            // 아래 패널이 화면 폭을 다 차지하면(휴대폰) 받침대는 패널 위쪽에 전체 폭으로
            const panelFull = ov.panelLeft < w * 0.35;
            const left = 24, right = panelFull ? w - 24 : Math.max(left + 200, ov.panelLeft - 24);
            const avail = right - left;
            let rows = 1, perRow = Math.max(1, count);
            let spacing = Math.min(130 * S, avail / perRow);
            if (spacing < 84 * S && count > 1) {
                rows = 2;
                perRow = Math.ceil(count / 2);
                spacing = Math.min(130 * S, avail / perRow);
            }
            const radius = Math.max(18, Math.min(40 * S, spacing / 2 - 8));
            const rowGap = radius + 36 * S;
            const baseY = panelFull ? ov.panelTop - 30 * S : h - 34 * S;
            const cx = (left + right) / 2;
            const positions = [];
            for (let i = 0; i < count; i++) {
                const row = rows === 2 && i < perRow ? 0 : (rows === 2 ? 1 : 0);
                const idxInRow = rows === 2 && row === 1 ? i - perRow : i;
                const nInRow = rows === 2 ? (row === 0 ? perRow : count - perRow) : count;
                positions.push({
                    x: cx + (idxInRow - (nInRow - 1) / 2) * spacing,
                    y: rows === 2 && row === 0 ? baseY - rowGap : baseY
                });
            }
            const topY = (rows === 2 ? baseY - rowGap : baseY) - radius - 10;
            return { positions, radius, topY };
        }

        function initRegularPolygon(n) {
            const { w, h } = getCanvasSize();
            const ov = getOverlayRects();
            // 위쪽 안내 카드와 아래 받침대 사이에 다각형이 들어가도록 배치
            // 휴대폰에서는 맨 위 꼭짓점의 수식 말풍선이 들어갈 자리를 위쪽에 남김
            const top = ov.topSafe + (w < 640 ? 84 : 44) * S;
            const bottom = Math.min(trayLayout(n).topY, ov.panelTop) - 56 * S;
            const cx = w / 2;
            const cy = (top + bottom) / 2;
            const radius = Math.max(80, Math.min(w * 0.3, (bottom - top) / 2));

            state.vertices = [];
            const startAngle = -Math.PI / 2;
            for (let i = 0; i < n; i++) {
                const theta = startAngle + (i * 2 * Math.PI) / n;
                state.vertices.push({
                    x: cx + radius * Math.cos(theta),
                    y: cy + radius * Math.sin(theta)
                });
            }

            state.centerPoint = { x: cx, y: cy };
            state.baseVertexIndex = 0;
            state.focusedVertexIdx = 0;
            state.manualDiagonals = [];
            state.manualSelectedVertex = -1;
            resetGatherSteps();
            resetSelectionForCurrentMode();
            updateDashboardUI();
        }

        function resetSelectionForCurrentMode() {
            const tris = computeTriangles();
            state.selectedTriIndices.clear();
            tris.forEach((_, idx) => state.selectedTriIndices.add(idx));
        }

        function normalizeAngleSigned(angle) {
            while (angle <= -Math.PI) angle += 2 * Math.PI;
            while (angle > Math.PI) angle -= 2 * Math.PI;
            return angle;
        }

        function isStrictlyConvexClockwise(verts) {
            const n = verts.length;
            const minTurnRad = (12 * Math.PI) / 180;
            const maxTurnRad = (168 * Math.PI) / 180;
            const minEdgeLen = 50;

            for (let i = 0; i < n; i++) {
                const prev = verts[(i - 1 + n) % n];
                const curr = verts[i];
                const next = verts[(i + 1) % n];

                const len1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
                const len2 = Math.hypot(next.x - curr.x, next.y - curr.y);
                if (len1 < minEdgeLen || len2 < minEdgeLen) return false;

                const ang1 = Math.atan2(curr.y - prev.y, curr.x - prev.x);
                const ang2 = Math.atan2(next.y - curr.y, next.x - curr.x);
                const turn = normalizeAngleSigned(ang2 - ang1);

                if (turn < minTurnRad || turn > maxTurnRad) return false;
            }
            return true;
        }

        // ---------------------------------------------------------------------------
        // 오목다각형까지 다루는 일반 도형 계산
        // ---------------------------------------------------------------------------
        function cross3(a, b, c) {
            return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
        }

        // 두 선분이 끝점이 아닌 곳에서 서로 엇갈리는지
        function segmentsCross(p1, p2, p3, p4) {
            const d1 = cross3(p3, p4, p1), d2 = cross3(p3, p4, p2);
            const d3 = cross3(p1, p2, p3), d4 = cross3(p1, p2, p4);
            return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
        }

        function distPointToSegment(p, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const len2 = dx * dx + dy * dy || 1;
            const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
            return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
        }

        function pointInPolygon(pt, verts) {
            let inside = false;
            for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
                const a = verts[i], b = verts[j];
                if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
            }
            return inside;
        }

        function polygonSignedArea(verts) {
            let s = 0;
            for (let i = 0; i < verts.length; i++) {
                const a = verts[i], b = verts[(i + 1) % verts.length];
                s += a.x * b.y - b.x * a.y;
            }
            return s / 2;
        }

        // 점이 다각형 안쪽에 있고, 모든 변에서 어느 정도 떨어져 있는지 (볼록·오목 모두)
        function isPointStrictlyInsidePolygon(pt, verts) {
            const margin = 28;
            if (!pointInPolygon(pt, verts)) return false;
            for (let i = 0; i < verts.length; i++) {
                if (distPointToSegment(pt, verts[i], verts[(i + 1) % verts.length]) < margin) return false;
            }
            return true;
        }

        // 선분 a-b가 다각형 안쪽으로만 지나는지 (대각선, 점 P와 꼭짓점을 잇는 선)
        function isSegmentInsidePolygon(a, b, verts) {
            const n = verts.length;
            for (let i = 0; i < n; i++) {
                if (segmentsCross(a, b, verts[i], verts[(i + 1) % n])) return false;
            }
            // 선분이 다른 꼭짓점을 스쳐 지나가는 경우
            for (const v of verts) {
                const isEnd = (Math.hypot(v.x - a.x, v.y - a.y) < 1) || (Math.hypot(v.x - b.x, v.y - b.y) < 1);
                if (!isEnd && distPointToSegment(v, a, b) < 3) return false;
            }
            for (const t of [0.25, 0.5, 0.75]) {
                if (!pointInPolygon({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }, verts)) return false;
            }
            return true;
        }

        // 꼭짓점 i가 오목한(내각이 180°보다 큰) 꼭짓점인지
        function isReflexVertex(verts, i) {
            const n = verts.length;
            return cross3(verts[(i - 1 + n) % n], verts[i], verts[(i + 1) % n]) < 0;
        }

        // 오목다각형 허용 시: 변끼리 엇갈리지 않는 단순다각형인지 검사
        function isSimpleValidPolygon(verts) {
            const n = verts.length;
            if (polygonSignedArea(verts) <= 0) return false;
            const minEdgeLen = 50;
            const minTurn = (12 * Math.PI) / 180, maxTurn = (168 * Math.PI) / 180;
            for (let i = 0; i < n; i++) {
                const prev = verts[(i - 1 + n) % n], curr = verts[i], next = verts[(i + 1) % n];
                if (Math.hypot(next.x - curr.x, next.y - curr.y) < minEdgeLen) return false;
                const turn = Math.abs(normalizeAngleSigned(Math.atan2(next.y - curr.y, next.x - curr.x) - Math.atan2(curr.y - prev.y, curr.x - prev.x)));
                if (turn < minTurn || turn > maxTurn) return false;
            }
            for (let i = 0; i < n; i++) {
                const a = verts[i], b = verts[(i + 1) % n];
                for (let j = i + 2; j < n; j++) {
                    if (i === 0 && j === n - 1) continue; // 이웃한 변
                    if (segmentsCross(a, b, verts[j], verts[(j + 1) % n])) return false;
                }
                // 꼭짓점이 이웃하지 않은 변에 너무 붙지 않게
                for (let k = 0; k < n; k++) {
                    if (k === i || k === (i + 1) % n) continue;
                    if (distPointToSegment(verts[k], a, b) < 24) return false;
                }
            }
            return true;
        }

        function isValidPolygonShape(verts) {
            return state.allowConcave ? isSimpleValidPolygon(verts) : isStrictlyConvexClockwise(verts);
        }

        // 한 꼭짓점에서 그은 대각선 중 다각형 밖으로 나가는 것들
        function getInvalidFanTargets() {
            const n = state.vertices.length, b = state.baseVertexIndex % n, bad = [];
            for (let k = 2; k < n - 1; k++) {
                const t = (b + k) % n;
                if (!isSegmentInsidePolygon(state.vertices[b], state.vertices[t], state.vertices)) bad.push(t);
            }
            return bad;
        }

        // 점 P에서 이을 수 없는(선이 다각형 밖으로 나가는) 꼭짓점들
        function getInvalidCenterTargets() {
            return state.vertices.map((v, i) => i).filter(i => !isSegmentInsidePolygon(state.centerPoint, state.vertices[i], state.vertices));
        }

        // 모든 꼭짓점이 보이는 안쪽 점을 찾음 (없으면 가장 안쪽 점)
        function findGoodCenter() {
            const vs = state.vertices;
            const xs = vs.map(v => v.x), ys = vs.map(v => v.y);
            const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
            let best = null, bestScore = -Infinity;
            for (let gx = 1; gx < 30; gx++) {
                for (let gy = 1; gy < 30; gy++) {
                    const p = { x: minX + (maxX - minX) * gx / 30, y: minY + (maxY - minY) * gy / 30 };
                    if (!isPointStrictlyInsidePolygon(p, vs)) continue;
                    const clearance = Math.min(...vs.map((v, i) => distPointToSegment(p, v, vs[(i + 1) % vs.length])));
                    const seesAll = vs.every(v => isSegmentInsidePolygon(p, v, vs));
                    const score = (seesAll ? 100000 : 0) + clearance;
                    if (score > bestScore) { bestScore = score; best = p; }
                }
            }
            return best || {
                x: vs.reduce((s, v) => s + v.x, 0) / vs.length,
                y: vs.reduce((s, v) => s + v.y, 0) / vs.length
            };
        }

        function extractSubPolygonsFromDiagonals(n, diagonals) {
            let faces = [Array.from({ length: n }, (_, i) => i)];
            for (const [u, v] of diagonals) {
                const nextFaces = [];
                for (const face of faces) {
                    const idxU = face.indexOf(u);
                    const idxV = face.indexOf(v);
                    if (idxU !== -1 && idxV !== -1 && Math.abs(idxU - idxV) > 1 && Math.abs(idxU - idxV) < face.length - 1) {
                        const i1 = Math.min(idxU, idxV);
                        const i2 = Math.max(idxU, idxV);
                        const poly1 = face.slice(i1, i2 + 1);
                        const poly2 = [...face.slice(i2), ...face.slice(0, i1 + 1)];
                        nextFaces.push(poly1, poly2);
                    } else {
                        nextFaces.push(face);
                    }
                }
                faces = nextFaces;
            }
            return faces;
        }

        function computeTriangles() {
            const n = state.vertices.length;
            const rawTris = [];

            if (state.triMode === 'VERTEX') {
                const b = state.baseVertexIndex % n;
                // 오목다각형에서 대각선이 밖으로 나가면 이 꼭짓점에서는 나눌 수 없음
                const fanOk = getInvalidFanTargets().length === 0;
                for (let k = 1; k < n - 1 && fanOk; k++) {
                    const i1 = b;
                    const i2 = (b + k) % n;
                    const i3 = (b + k + 1) % n;
                    rawTris.push({
                        points: [
                            { ...state.vertices[i1], label: VERTEX_LETTERS[i1], vertexIdx: i1, isCenter: false },
                            { ...state.vertices[i2], label: VERTEX_LETTERS[i2], vertexIdx: i2, isCenter: false },
                            { ...state.vertices[i3], label: VERTEX_LETTERS[i3], vertexIdx: i3, isCenter: false }
                        ]
                    });
                }
            } else if (state.triMode === 'MANUAL') {
                const faces = extractSubPolygonsFromDiagonals(n, state.manualDiagonals);
                faces.forEach(face => {
                    if (face.length === 3) {
                        rawTris.push({
                            points: face.map(idx => ({
                                ...state.vertices[idx],
                                label: VERTEX_LETTERS[idx],
                                vertexIdx: idx,
                                isCenter: false
                            }))
                        });
                    }
                });
            } else if (state.triMode === 'CENTER') {
                const centerOk = getInvalidCenterTargets().length === 0;
                for (let i = 0; i < n && centerOk; i++) {
                    const next = (i + 1) % n;
                    rawTris.push({
                        points: [
                            { ...state.vertices[i], label: VERTEX_LETTERS[i], vertexIdx: i, isCenter: false },
                            { ...state.vertices[next], label: VERTEX_LETTERS[next], vertexIdx: next, isCenter: false },
                            { ...state.centerPoint, label: 'P', vertexIdx: -1, isCenter: true }
                        ]
                    });
                }
            }

            return rawTris.map((t, tIdx) => {
                const pts = t.points;
                const cx = (pts[0].x + pts[1].x + pts[2].x) / 3;
                const cy = (pts[0].y + pts[1].y + pts[2].y) / 3;
                const palette = TRI_PALETTE[tIdx % TRI_PALETTE.length];

                const corners = pts.map((curr, cIdx) => {
                    const nextPt = pts[(cIdx + 1) % 3];
                    const prevPt = pts[(cIdx + 2) % 3];

                    const startAngle = Math.atan2(nextPt.y - curr.y, nextPt.x - curr.x);
                    const endAngle = Math.atan2(prevPt.y - curr.y, prevPt.x - curr.x);
                    let sweepRad = normalizeAngleSigned(endAngle - startAngle);
                    if (sweepRad < 0) sweepRad += Math.PI * 2;

                    const exactDeg = (sweepRad * 180) / Math.PI;
                    return {
                        cornerIdx: cIdx,
                        pt: curr,
                        label: curr.label,
                        vertexIdx: curr.vertexIdx,
                        isCenter: curr.isCenter,
                        startAngle,
                        endAngle,
                        sweepRad,
                        exactDeg,
                        displayDeg: Math.round(exactDeg)
                    };
                });

                // 합이 정확히 180도가 되도록 정수 보정
                // 반올림 차이는 원래 값과 가장 가까운 쪽으로 보정 (최대 나머지 방식)
                const degSum = corners[0].displayDeg + corners[1].displayDeg + corners[2].displayDeg;
                if (degSum !== 180) {
                    const dir = Math.sign(180 - degSum);
                    const order = [...corners].sort((p, q) => dir * ((q.exactDeg - q.displayDeg) - (p.exactDeg - p.displayDeg)));
                    for (let k = 0; k < Math.abs(180 - degSum); k++) order[k % 3].displayDeg += dir;
                }

                return {
                    index: tIdx,
                    id: `T${tIdx + 1}`,
                    palette,
                    centroid: { x: cx, y: cy },
                    points: pts,
                    corners
                };
            });
        }

        // 각 다각형 꼭짓점에 모인 삼각형 조각들의 관계 추출
        function computeVertexAngleRelationships(triangles) {
            const n = state.vertices.length;
            const vertexRels = [];

            for (let vIdx = 0; vIdx < n; vIdx++) {
                const pieces = [];
                triangles.forEach(tri => {
                    tri.corners.forEach(corner => {
                        if (corner.vertexIdx === vIdx) {
                            pieces.push({
                                triId: tri.id,
                                triIndex: tri.index,
                                cornerIdx: corner.cornerIdx,
                                palette: tri.palette,
                                deg: corner.displayDeg,
                                sweepRad: corner.sweepRad
                            });
                        }
                    });
                });

                let totalDeg = pieces.reduce((sum, p) => sum + p.deg, 0);
                if (pieces.length === 0) {
                    // 아직 나뉘지 않은 꼭짓점: 다각형의 실제 내각
                    const v = state.vertices[vIdx], prev = state.vertices[(vIdx - 1 + n) % n], next = state.vertices[(vIdx + 1) % n];
                    let sw = normalizeAngleSigned(Math.atan2(prev.y - v.y, prev.x - v.x) - Math.atan2(next.y - v.y, next.x - v.x));
                    if (sw < 0) sw += Math.PI * 2;
                    totalDeg = Math.round(sw * 180 / Math.PI);
                }
                vertexRels.push({
                    vertexIdx: vIdx,
                    label: VERTEX_LETTERS[vIdx],
                    pieces,
                    totalDeg
                });
            }
            return vertexRels;
        }

        // ============================================================================
        // 4. STEP-BY-STEP 180° GATHER ENGINE (개선 2)
        // ============================================================================
        function resetGatherSteps() {
            state.stepWedgeCount = 0;
            state.targetTriForStep = 0;
            state.gatherSliderValue = 0;
            document.getElementById('gatherSlider').value = 0;
            document.getElementById('gatherValueLabel').textContent = '0%';
            updateStepStatusBadge();
        }

        function updateStepStatusBadge() {
            const tris = computeTriangles();
            const badge = document.getElementById('step-status-badge');
            const btnText = document.getElementById('step-btn-text');

            if (tris.length === 0) {
                badge.textContent = "삼각형 없음";
                btnText.textContent = "먼저 대각선을 그어 보세요";
                return;
            }

            const currentTri = tris[state.targetTriForStep % tris.length];
            const currentCount = state.stepWedgeCount;

            badge.textContent = `${currentTri.id} 모으는 중 (${currentCount} / 3 조각)`;
            if (currentCount === 0) {
                btnText.textContent = `${currentTri.id} 첫 번째 각 모으기`;
            } else if (currentCount === 1) {
                btnText.textContent = `${currentTri.id} 두 번째 각 모으기`;
            } else if (currentCount === 2) {
                btnText.textContent = `${currentTri.id} 세 번째 각 모아 180° 완성!`;
            } else {
                const nextTriIdx = (state.targetTriForStep + 1) % tris.length;
                btnText.textContent = `다음 삼각형(T${nextTriIdx + 1}) 모으기`;
            }
        }

        function stepGatherNextWedge() {
            const tris = computeTriangles();
            if (tris.length === 0) return;

            if (state.stepWedgeCount < 3) {
                state.stepWedgeCount++;
            } else {
                // 다음 삼각형으로 전진
                state.targetTriForStep = (state.targetTriForStep + 1) % tris.length;
                state.stepWedgeCount = 1;
            }

            // 슬라이더 동기화
            const totalSteps = tris.length * 3;
            const currentTotalStep = state.targetTriForStep * 3 + state.stepWedgeCount;
            const pct = Math.min(100, Math.round((currentTotalStep / totalSteps) * 100));
            state.gatherSliderValue = pct;
            document.getElementById('gatherSlider').value = pct;
            document.getElementById('gatherValueLabel').textContent = `${pct}%`;

            updateStepStatusBadge();
            updateDashboardUI();
        }

        function gatherSpecificTriangle(triIdx) {
            state.targetTriForStep = triIdx;
            state.stepWedgeCount = 3;
            updateStepStatusBadge();
            updateDashboardUI();
        }

        function toggleGatherFull() {
            const tris = computeTriangles();
            if (state.gatherSliderValue >= 95) {
                resetGatherSteps();
            } else {
                state.targetTriForStep = Math.max(0, tris.length - 1);
                state.stepWedgeCount = 3;
                state.gatherSliderValue = 100;
                document.getElementById('gatherSlider').value = 100;
                document.getElementById('gatherValueLabel').textContent = '100%';
                updateStepStatusBadge();
            }
            updateDashboardUI();
        }

        function onGatherSliderChange(val) {
            const tris = computeTriangles();
            state.gatherSliderValue = parseFloat(val);
            document.getElementById('gatherValueLabel').textContent = `${Math.round(val)}%`;

            const totalSteps = tris.length * 3;
            const stepIndex = Math.min(totalSteps, Math.floor((val / 100) * totalSteps));
            state.targetTriForStep = Math.min(tris.length - 1, Math.floor(stepIndex / 3));
            state.stepWedgeCount = stepIndex % 3;
            if (val >= 99) {
                state.targetTriForStep = tris.length - 1;
                state.stepWedgeCount = 3;
            }
            updateStepStatusBadge();
        }

        // ============================================================================
        // 5. UI CONTROLLERS & ACTIONS
        // ============================================================================
        function setPolygonSides(n) {
            n = Math.max(MIN_SIDES, Math.min(MAX_SIDES, n));
            state.numSides = n;
            document.getElementById('sides-label').textContent = polyName(n);
            document.getElementById('sides-sub').textContent = `n = ${n}`;
            document.getElementById('btn-sides-minus').disabled = n <= MIN_SIDES;
            document.getElementById('btn-sides-plus').disabled = n >= MAX_SIDES;
            initRegularPolygon(n);
        }

        function changeSides(delta) {
            setPolygonSides(state.numSides + delta);
        }

        function applyBoardMode() {
            // 칠판 모드는 넓은 화면(가로 1024px 이상)에서만. 휴대폰에서는 그림 요소를 조금 작게
            const on = state.boardMode && window.innerWidth >= 1024;
            S = on ? Math.max(1, Math.min(1.7, window.innerWidth / 1370)) : (window.innerWidth < 640 ? 0.85 : 1);
            document.documentElement.classList.toggle('board', on);
            const btn = document.getElementById('btn-board');
            btn.className = state.boardMode
                ? "hidden lg:flex px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-900 bg-slate-900 text-white transition-all items-center gap-1.5"
                : "hidden lg:flex px-3 py-2 rounded-xl text-sm font-bold border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all items-center gap-1.5";
            document.getElementById('text-board-btn').textContent = state.boardMode ? '칠판 모드 켜짐' : '칠판 모드';
        }

        function toggleBoardMode() {
            state.boardMode = !state.boardMode;
            try { localStorage.setItem('polygonLab.boardMode', state.boardMode ? '1' : '0'); } catch (e) {}
            applyBoardMode();
            // 글자 크기가 바뀌면 화면 배치가 바뀌므로 다각형을 다시 그림
            requestAnimationFrame(() => { resizeCanvas(); initRegularPolygon(state.numSides); });
        }

        function toggleFullscreen() {
            try {
                const p = !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }

        function resetToRegularPolygon() {
            initRegularPolygon(state.numSides);
        }

        function setTriMode(mode) {
            state.triMode = mode;
            state.manualSelectedVertex = -1;
            resetGatherSteps();

            const modes = [
                { key: 'VERTEX', id: 'mode-vertex-btn' },
                { key: 'MANUAL', id: 'mode-manual-btn' },
                { key: 'CENTER', id: 'mode-center-btn' }
            ];
            modes.forEach(m => {
                const el = document.getElementById(m.id);
                el.className = m.key === mode
                    ? "py-2 px-1 rounded-lg text-sm font-extrabold transition-all bg-white text-slate-900 shadow-sm text-center"
                    : "py-2 px-1 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900 text-center";
            });
            const hints = {
                VERTEX: '꼭짓점을 끌어 모양을 바꾸거나, 눌러서 기준 꼭짓점을 바꿔 보세요',
                MANUAL: '두 꼭짓점을 차례로 누르면 대각선이 생겨요 (다시 누르면 지워져요)',
                CENTER: '빨간 점 P를 끌어 위치를 바꿔 보세요'
            };
            document.getElementById('canvas-hint').textContent = hints[mode];

            if (mode === 'CENTER' && (!isPointStrictlyInsidePolygon(state.centerPoint, state.vertices) || getInvalidCenterTargets().length > 0)) {
                state.centerPoint = findGoodCenter();
            }

            resetSelectionForCurrentMode();
            updateDashboardUI();
        }

        // ---------------------------------------------------------------------------
        // 각도 보기 메뉴: 화면의 각도 숫자를 종류별로 켜고 끔
        // ---------------------------------------------------------------------------
        const VIEW_OPTIONS = [
            { key: 'showTriangleAngles', title: '나뉜 각의 크기', desc: '꼭짓점 주변 삼각형 조각의 각도 숫자', swatch: '#F43F5E' },
            { key: 'showVertexBreakdown', title: '꼭짓점 수식 말풍선', desc: '∠A = 36° + 36° + 36° = 108°', swatch: '#0F172A' },
            { key: 'showTotalVertexLabels', title: '다각형의 내각의 크기', desc: '꼭짓점 바깥의 보라색 숫자', swatch: '#4338CA' }
        ];

        function renderViewMenu() {
            document.getElementById('view-menu-items').innerHTML = VIEW_OPTIONS.map(o => {
                const on = state[o.key];
                return `<button onclick="toggleView('${o.key}')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-left">
                    <span class="w-3 h-8 rounded-full shrink-0" style="background:${o.swatch}; opacity:${on ? 1 : 0.25}"></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-base font-extrabold ${on ? 'text-slate-900' : 'text-slate-400'}">${o.title}</span>
                        <span class="block text-xs font-semibold text-slate-500 font-mono-num truncate">${o.desc}</span>
                    </span>
                    <span class="relative w-11 h-6 rounded-full shrink-0 transition-all ${on ? 'bg-indigo-600' : 'bg-slate-300'}">
                        <span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all" style="left:${on ? '1.375rem' : '0.125rem'}"></span>
                    </span>
                </button>`;
            }).join('');
            const count = VIEW_OPTIONS.filter(o => state[o.key]).length;
            document.getElementById('view-count').textContent = count;
            document.getElementById('btn-view-menu').className = count > 0
                ? "px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all flex items-center gap-1.5"
                : "px-3 py-2 rounded-xl text-sm font-extrabold border-2 border-slate-300 bg-white text-slate-500 transition-all flex items-center gap-1.5";
            // 말풍선이 꺼지면 같은 정보를 왼쪽 위 카드로 보여줌 (다른 숫자도 모두 꺼져 있으면 카드도 숨김)
            const card = document.getElementById('vertex-focus-card');
            card.classList.toggle('hidden', state.showVertexBreakdown || count === 0);
        }

        function toggleView(key) {
            state[key] = !state[key];
            renderViewMenu();
        }

        function setAllViews(on) {
            VIEW_OPTIONS.forEach(o => state[o.key] = on);
            renderViewMenu();
        }

        // ---------------------------------------------------------------------------
        // 오목다각형 허용 스위치
        // ---------------------------------------------------------------------------
        function renderConcaveSwitch() {
            const on = state.allowConcave;
            const sw = document.getElementById('switch-concave');
            sw.className = `relative w-9 h-5 rounded-full transition-all ${on ? 'bg-orange-500' : 'bg-slate-300'}`;
            sw.firstElementChild.style.left = on ? '1.125rem' : '0.125rem';
            document.getElementById('btn-concave').className = on
                ? "shrink-0 pl-2 pr-3 py-2 rounded-xl text-sm font-extrabold border-2 border-orange-500 bg-orange-50 text-orange-700 transition-all flex items-center gap-2"
                : "shrink-0 pl-2 pr-3 py-2 rounded-xl text-sm font-bold border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-2";
        }

        // 꼭짓점 하나를 안쪽으로 밀어 넣어 오목다각형을 만들어 줌
        function dentOneVertex() {
            const n = state.vertices.length;
            if (n < 4) return -1;
            const idx = Math.round(n / 2) % n;
            const prev = state.vertices[(idx - 1 + n) % n], next = state.vertices[(idx + 1) % n], v = state.vertices[idx];
            const mid = { x: (prev.x + next.x) / 2, y: (prev.y + next.y) / 2 };
            for (const f of [0.6, 0.45, 0.3, 0.15]) {
                const trial = state.vertices.map(p => ({ ...p }));
                trial[idx] = { x: mid.x + (mid.x - v.x) * f, y: mid.y + (mid.y - v.y) * f };
                if (isSimpleValidPolygon(trial) && isReflexVertex(trial, idx)) {
                    state.vertices = trial;
                    return idx;
                }
            }
            return -1;
        }

        function toggleConcave() {
            state.allowConcave = !state.allowConcave;
            renderConcaveSwitch();
            if (state.allowConcave) {
                if (state.numSides === 3) {
                    flashWarning('삼각형은 오목하게 만들 수 없어요. 변의 수를 늘려 보세요');
                } else if (isStrictlyConvexClockwise(state.vertices)) {
                    const idx = dentOneVertex();
                    if (idx >= 0) {
                        // 오목한 꼭짓점에서 나누면 잘 나뉘므로 기준·관찰 꼭짓점으로 지정
                        state.baseVertexIndex = idx;
                        state.focusedVertexIdx = idx;
                    }
                }
            } else if (!isStrictlyConvexClockwise(state.vertices)) {
                // 볼록다각형만 허용하면 지금 모양을 정다각형으로 되돌림
                initRegularPolygon(state.numSides);
            }
            state.manualDiagonals = state.manualDiagonals.filter(([a, b]) => isSegmentInsidePolygon(state.vertices[a], state.vertices[b], state.vertices));
            if (state.triMode === 'CENTER' && getInvalidCenterTargets().length > 0) state.centerPoint = findGoodCenter();
            resetGatherSteps();
            resetSelectionForCurrentMode();
            updateDashboardUI();
        }
