        // ============================================================================
        // 7. POINTER & INTERACTION
        // ============================================================================
        function getPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function isPointInTriangle(pt, v0, v1, v2) {
            const d1 = (pt.x - v1.x) * (v0.y - v1.y) - (v0.x - v1.x) * (pt.y - v1.y);
            const d2 = (pt.x - v2.x) * (v1.y - v2.y) - (v1.x - v2.x) * (pt.y - v2.y);
            const d3 = (pt.x - v0.x) * (v2.y - v0.y) - (v2.x - v0.x) * (pt.y - v0.y);
            return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        function onPointerDown(evt) {
            const pos = getPointerPos(evt);
            state.pointerDownPos = pos;
            state.hasDragged = false;

            if (state.triMode === 'CENTER' && Math.hypot(pos.x - state.centerPoint.x, pos.y - state.centerPoint.y) <= 24 * S) {
                state.draggingCenterPoint = true;
                if (evt.cancelable) evt.preventDefault();
                return;
            }

            for (let i = 0; i < state.vertices.length; i++) {
                if (Math.hypot(pos.x - state.vertices[i].x, pos.y - state.vertices[i].y) <= 26 * S) {
                    state.draggingVertexIndex = i;
                    state.focusedVertexIdx = i;
                    updateDashboardUI();
                    if (evt.cancelable) evt.preventDefault();
                    return;
                }
            }
        }

        function onPointerMove(evt) {
            const pos = getPointerPos(evt);
            const { w, h } = getCanvasSize();

            if (state.pointerDownPos && Math.hypot(pos.x - state.pointerDownPos.x, pos.y - state.pointerDownPos.y) > 6) {
                state.hasDragged = true;
            }

            if (state.draggingCenterPoint) {
                if (evt.cancelable) evt.preventDefault();
                const oldP = { ...state.centerPoint };
                state.centerPoint = { x: pos.x, y: pos.y };
                if (!isPointStrictlyInsidePolygon(state.centerPoint, state.vertices)) {
                    state.centerPoint = oldP;
                } else {
                    updateDashboardUI();
                }
                return;
            }

            if (state.draggingVertexIndex !== -1) {
                if (evt.cancelable) evt.preventDefault();
                const idx = state.draggingVertexIndex;
                const oldV = { ...state.vertices[idx] };
                const pad = 30 * S;
                const n = state.vertices.length;
                const maxBottom = state.gatherLayout === 'TRAY' ? trayLayout(state.triMode === 'CENTER' ? n : n - 2).topY - 20 * S : h - pad;

                state.vertices[idx] = {
                    x: Math.max(pad, Math.min(w - pad, pos.x)),
                    y: Math.max(pad, Math.min(maxBottom, pos.y))
                };

                const validShape = isValidPolygonShape(state.vertices);
                const validCenter = state.triMode !== 'CENTER' || isPointStrictlyInsidePolygon(state.centerPoint, state.vertices);
                // 직접 그은 대각선이 밖으로 나가게 되는 움직임은 막음
                const validManual = state.triMode !== 'MANUAL' || state.manualDiagonals.every(([a, b]) =>
                    isSegmentInsidePolygon(state.vertices[a], state.vertices[b], state.vertices));

                if (!validShape || !validCenter || !validManual) {
                    state.vertices[idx] = oldV;
                } else {
                    updateDashboardUI();
                }
                return;
            }

            // Hover check
            let hoverV = -1;
            for (let i = 0; i < state.vertices.length; i++) {
                if (Math.hypot(pos.x - state.vertices[i].x, pos.y - state.vertices[i].y) <= 26 * S) {
                    hoverV = i;
                    break;
                }
            }
            if (hoverV !== -1 && hoverV !== state.focusedVertexIdx) {
                state.focusedVertexIdx = hoverV;
                updateDashboardUI();
            }
            state.hoveredVertexIndex = hoverV;
        }

      function onPointerUp(evt) {
    const clickedVertex = state.draggingVertexIndex;
    const wasDraggingCenter = state.draggingCenterPoint;
    state.draggingVertexIndex = -1;
    state.draggingCenterPoint = false;

    if (!state.pointerDownPos || state.hasDragged || wasDraggingCenter) {
        state.pointerDownPos = null;
        return;
    }

    state.pointerDownPos = null;

    if (clickedVertex !== -1) {
        if (state.triMode === 'VERTEX') {
            state.baseVertexIndex = clickedVertex;
        } else if (state.triMode === 'MANUAL') {
            handleManualVertexTap(clickedVertex);
        }
        state.focusedVertexIdx = clickedVertex;
        updateDashboardUI();
    }
}
// 두 꼭짓점을 클릭해 대각선을 직접 긋거나 지우는 함수
function handleManualVertexTap(vIdx) {
    const n = state.vertices.length;
    if (state.manualSelectedVertex === -1) {
        state.manualSelectedVertex = vIdx; // 첫 번째 꼭짓점 선택
        return;
    }

    if (state.manualSelectedVertex === vIdx) {
        state.manualSelectedVertex = -1; // 취소
        return;
    }

    const u = Math.min(state.manualSelectedVertex, vIdx);
    const v = Math.max(state.manualSelectedVertex, vIdx);
    state.manualSelectedVertex = -1;

    // 인접한 다각형 변은 대각선이 될 수 없음
    if (v - u === 1 || (u === 0 && v === n - 1)) return;

    // 이미 존재하는 대각선이면 제거(토글), 없으면 교차 여부 확인 후 추가
    const existingIdx = state.manualDiagonals.findIndex(([a, b]) => a === u && b === v);
    if (existingIdx !== -1) {
        state.manualDiagonals.splice(existingIdx, 1);
    } else {
        const crosses = state.manualDiagonals.some(([a, b]) => {
            const x = Math.min(a, b), y = Math.max(a, b);
            return (u < x && x < v && v < y) || (x < u && u < y && y < v);
        });
        if (!isSegmentInsidePolygon(state.vertices[u], state.vertices[v], state.vertices)) {
            flashWarning(`${VERTEX_LETTERS[u]}${VERTEX_LETTERS[v]}는 다각형 밖으로 나가서 대각선으로 쓸 수 없어요`);
        } else if (crosses) {
            flashWarning('이미 그은 대각선과 엇갈려요');
        } else {
            state.manualDiagonals.push([u, v]);
        }
    }

    resetGatherSteps();
    resetSelectionForCurrentMode();
}
        // ============================================================================
        // 8. ANIMATION LOOP & POWERFUL VISUAL RENDERING
        // ============================================================================
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function interpolateAngle(a1, a2, t) {
            const diff = normalizeAngleSigned(a2 - a1);
            return a1 + diff * t;
        }

        let lastTime = performance.now();

        function animateLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // 각 삼각형별 조각들의 목표 이동도(0 또는 1)를 향해 부드럽게 보간
            const tris = computeTriangles();
            tris.forEach(t => {
                t.corners.forEach((c, cIdx) => {
                    const key = `${t.index}_${cIdx}`;
                    // 만약 현재 t가 이전 삼각형이면 100% 모임
                    // 현재 대상 삼각형이면 stepWedgeCount에 따라 해당 조각만 모임
                    let targetVal = 0;
                    if (t.index < state.targetTriForStep) {
                        targetVal = 1;
                    } else if (t.index === state.targetTriForStep) {
                        targetVal = cIdx < state.stepWedgeCount ? 1 : 0;
                    } else {
                        targetVal = 0;
                    }

                    if (state.wedgeAnimProgress[key] === undefined) state.wedgeAnimProgress[key] = 0;
                    const diff = targetVal - state.wedgeAnimProgress[key];
                    state.wedgeAnimProgress[key] += diff * Math.min(1, 10 * dt);
                });
            });

            renderScene();
            requestAnimationFrame(animateLoop);
        }

        function renderScene() {
            const { w, h } = getCanvasSize();
            ctx.clearRect(0, 0, w, h);
            if (state.vertices.length === 0) return;

            const tris = computeTriangles();
            const vertexRels = computeVertexAngleRelationships(tris);

            // 1. Polygon Fill
            ctx.save();
            ctx.beginPath();
            state.vertices.forEach((v, idx) => {
                if (idx === 0) ctx.moveTo(v.x, v.y);
                else ctx.lineTo(v.x, v.y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
            ctx.restore();

            // 2. Divided Triangles Background Fill
            tris.forEach(t => {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(t.points[0].x, t.points[0].y);
                ctx.lineTo(t.points[1].x, t.points[1].y);
                ctx.lineTo(t.points[2].x, t.points[2].y);
                ctx.closePath();
                ctx.fillStyle = state.boardMode ? t.palette.boardFill : t.palette.fill;
                ctx.fill();

                // Centroid Label Watermark
                ctx.font = monoFont(15);
                ctx.fillStyle = t.palette.hex;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.id, t.centroid.x, t.centroid.y);
                ctx.restore();
            });

            // 3. Triangulation Lines (대각선)
            drawTriangulationLines();

            // 4. Polygon Outer Boundary
            ctx.save();
            ctx.beginPath();
            state.vertices.forEach((v, idx) => {
                if (idx === 0) ctx.moveTo(v.x, v.y);
                else ctx.lineTo(v.x, v.y);
            });
            ctx.closePath();
            ctx.lineWidth = 3.5 * S;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0F172A';
            ctx.stroke();
            ctx.restore();

            // =========================================================================
            // 핵심 1: 다각형의 원래 내각 아크와 삼각형 분할각의 관계를 보여주는 시각 레이어
            // =========================================================================
            if (state.showVertexBreakdown) {
                vertexRels.forEach(rel => {
                    const v = state.vertices[rel.vertexIdx];
                    const isFocused = rel.vertexIdx === state.focusedVertexIdx;

                    // 꼭짓점에 모인 조각들을 감싸는 다각형의 원래 내각 기준 외곽선
                    if (rel.pieces.length > 0) {
                        ctx.save();
                        // 집중된 꼭짓점에는 은은한 하이라이트 펄스 원
                        if (isFocused) {
                            ctx.beginPath();
                            ctx.arc(v.x, v.y, 48 * S, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(99, 102, 241, 0.12)';
                            ctx.fill();
                            ctx.lineWidth = 2 * S;
                            ctx.setLineDash([4 * S, 4 * S]);
                            ctx.strokeStyle = '#6366F1';
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                        ctx.restore();
                    }
                });
            }

            // =========================================================================
            // 핵심 2: 삼각형 내각 조각들 (하나씩 날아가서 180° 반원 만드는 애니메이션)
            // =========================================================================
            const tray = trayLayout(tris.length);
            const wedgeRadius = state.gatherLayout === 'TRAY' ? tray.radius : 34 * S;

            // Tray Base Shelf Rendering
            if (state.gatherLayout === 'TRAY' && tris.length > 0) {
                ctx.save();
                tris.forEach((t, tIdx) => {
                    const tx = tray.positions[tIdx].x;
                    const trayY = tray.positions[tIdx].y;
                    // 받침대 가이드 (180도 반원 자리)
                    ctx.beginPath();
                    ctx.arc(tx, trayY, wedgeRadius + 6, Math.PI, 0, false);
                    ctx.lineTo(tx + wedgeRadius + 6, trayY);
                    ctx.lineTo(tx - wedgeRadius - 6, trayY);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fill();
                    ctx.lineWidth = 2 * S;
                    ctx.setLineDash([4 * S, 4 * S]);
                    ctx.strokeStyle = t.palette.hex;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 받침선 (평각 지름)
                    ctx.beginPath();
                    ctx.moveTo(tx - wedgeRadius - 10, trayY);
                    ctx.lineTo(tx + wedgeRadius + 10, trayY);
                    ctx.lineWidth = 3 * S;
                    ctx.strokeStyle = '#334155';
                    ctx.stroke();

                    // 삼각형 이름표
                    ctx.font = monoFont(12);
                    ctx.fillStyle = t.palette.textHex;
                    ctx.textAlign = 'center';
                    ctx.fillText(`${t.id} 180°`, tx, trayY + 20 * S);
                });
                ctx.restore();
            }

            // Draw individual wedges
            const labelQueue = [];
            const vertexWedgeR = {}; // 꼭짓점별 가장 긴 부채꼴 반지름 (내각 호를 그 바깥에 그리기 위함)
            tris.forEach((t, tIdx) => {
                const targetX = state.gatherLayout === 'TRAY' ? tray.positions[tIdx].x : t.centroid.x;
                const targetY = state.gatherLayout === 'TRAY' ? tray.positions[tIdx].y : (t.centroid.y + 12 * S);

                let runningDestAngle = -Math.PI;

                t.corners.forEach((c, cIdx) => {
                    const key = `${t.index}_${cIdx}`;
                    const prog = easeInOutCubic(state.wedgeAnimProgress[key] || 0);

                    // 목표 각도 (반원 -PI ~ 0에 딱 맞물리도록 배치)
                    const destStart = runningDestAngle;
                    runningDestAngle += c.sweepRad;

                    // 위치 및 각도 보간
                    const curX = c.pt.x + (targetX - c.pt.x) * prog;
                    const curY = c.pt.y + (targetY - c.pt.y) * prog;
                    const curStartAngle = interpolateAngle(c.startAngle, destStart, prog);
                    const curEndAngle = curStartAngle + c.sweepRad;
                    // 꼭짓점에 있을 때의 부채꼴 크기: 각도 숫자가 안에 들어가도록 좁은 각은 길게
                    const label = `${c.displayDeg}°`;
                    const labelPx = Math.round(15 * S);
                    ctx.font = `800 ${labelPx}px "JetBrains Mono", Consolas, monospace`;
                    const tw = ctx.measureText(label).width;
                    const baseR = 46 * S, maxR = baseR * 2.1;
                    const halfSin = Math.sin(Math.min(c.sweepRad, Math.PI * 0.999) / 2);
                    // 글자 상자를 감싸는 원(반지름 rt)이 부채꼴 안, 꼭짓점 원 밖에 들어가는 거리
                    const rt = Math.hypot(tw / 2, labelPx / 2) + 2 * S;
                    const labelD = Math.max(20 * S + rt, rt / Math.max(halfSin, 0.01));
                    const needR = labelD + rt + 3 * S;
                    const fitsInside = !state.showTriangleAngles || needR <= maxR;
                    const r0 = state.showTriangleAngles && fitsInside ? Math.max(baseR, needR) : baseR;
                    const r = r0 + (wedgeRadius - r0) * prog;
                    if (c.vertexIdx >= 0) vertexWedgeR[c.vertexIdx] = Math.max(vertexWedgeR[c.vertexIdx] || 0, r0);

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(curX, curY);
                    ctx.arc(curX, curY, r, curStartAngle, curEndAngle, false);
                    ctx.closePath();

                    // 모으기 전에도 모은 뒤와 같은 진한 부채꼴 (숫자를 끄면 연하게)
                    ctx.fillStyle = (state.showTriangleAngles || prog > 0.4) ? t.palette.wedgeFill : t.palette.activeFill;
                    ctx.fill();
                    ctx.lineWidth = 2 * S;
                    ctx.strokeStyle = (state.showTriangleAngles || prog > 0.4) ? '#FFFFFF' : t.palette.hex;
                    ctx.stroke();

                    // 부채꼴 안 흰 글씨 (밝은 색 위에서도 읽히도록 어두운 테두리).
                    // 모든 부채꼴을 그린 뒤에 한꺼번에 써서 다른 부채꼴에 가려지지 않게 함
                    const wedgeText = (txt, x, y, px, alpha, color) => labelQueue.push(() => {
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                        ctx.font = `800 ${Math.round(px)}px "JetBrains Mono", Consolas, monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.lineJoin = 'round';
                        ctx.lineWidth = 4 * S;
                        ctx.strokeStyle = color ? 'rgba(255, 255, 255, 0.95)' : 'rgba(15, 23, 42, 0.45)';
                        ctx.strokeText(txt, x, y);
                        ctx.fillStyle = color || '#FFFFFF';
                        ctx.fillText(txt, x, y);
                        ctx.restore();
                    });

                    // 각도 수치 표시
                    const midA = curStartAngle + c.sweepRad / 2;
                    if (!state.showTriangleAngles) {
                        // 각도 숫자 끔
                    } else if (prog < 0.35) {
                        const alpha = 1 - prog * 2.5;
                        if (fitsInside) {
                            wedgeText(label, curX + labelD * Math.cos(midA), curY + labelD * Math.sin(midA), labelPx, alpha);
                        } else {
                            // 아주 좁은 각: 부채꼴 끝 바깥, 이웃 숫자와 겹치지 않을 만큼 떨어진 곳에 같은 색 글씨
                            const d = Math.max(r + rt + 3 * S, labelD);
                            wedgeText(label, curX + d * Math.cos(midA), curY + d * Math.sin(midA), labelPx, alpha, t.palette.textHex);
                        }
                    } else if (prog > 0.75 && c.sweepRad > 0.28) {
                        // 모였을 때 반원 안 숫자 (너무 좁은 조각은 생략)
                        wedgeText(label, curX + (r * 0.62) * Math.cos(midA), curY + (r * 0.62) * Math.sin(midA), Math.min(13 * S, r * 0.34), 1);
                    }
                    ctx.restore();
                });
            });
            // 다각형 테두리를 부채꼴 위에 다시 그려 경계가 끊겨 보이지 않게
            ctx.save();
            ctx.beginPath();
            state.vertices.forEach((v, idx) => idx === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y));
            ctx.closePath();
            ctx.lineWidth = 3.5 * S;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0F172A';
            ctx.stroke();
            ctx.restore();
            labelQueue.forEach(draw => draw());

            // 5-1. 다각형의 각 내각 크기 배지 (꼭짓점 바깥쪽)
            if (state.showTotalVertexLabels) {
                const n = state.vertices.length;
                vertexRels.forEach(rel => {
                    if (state.showVertexBreakdown && rel.vertexIdx === state.focusedVertexIdx) return;
                    const v = state.vertices[rel.vertexIdx];
                    const prev = state.vertices[(rel.vertexIdx - 1 + n) % n];
                    const next = state.vertices[(rel.vertexIdx + 1) % n];
                    const aStart = Math.atan2(next.y - v.y, next.x - v.x);
                    let sweep = normalizeAngleSigned(Math.atan2(prev.y - v.y, prev.x - v.x) - aStart);
                    if (sweep < 0) sweep += Math.PI * 2;
                    const outA = aStart + sweep / 2 + Math.PI;
                    const d = 40 * S;
                    // 다각형 실제 내각 (조각 반올림과 무관한 값)
                    const exact = Math.round(sweep * 180 / Math.PI);
                    drawCrispBadge(v.x + d * Math.cos(outA), v.y + d * Math.sin(outA), `${exact}°`, '#FFFFFF', '#4338CA', '#312E81', 15 * S, 1);
                });
            }

  // 5. [수업 시연 핵심] 다각형 원래 내각과 삼각형 분할각의 합성 관계 대형 표시
            if (state.showVertexBreakdown && state.focusedVertexIdx >= 0) {
                const rel = vertexRels[state.focusedVertexIdx];
                const v = state.vertices[state.focusedVertexIdx];

                if (rel && rel.pieces.length > 0) {
                    ctx.save();

                    // 1) 다각형의 원래 전체 내각 틀(두꺼운 인디고 호)을 그려 "원래 각"의 영역 강조
                    const n = state.vertices.length;
                    const prev = state.vertices[(rel.vertexIdx - 1 + n) % n];
                    const next = state.vertices[(rel.vertexIdx + 1) % n];
                    const aStart = Math.atan2(next.y - v.y, next.x - v.x);
                    const aEnd = Math.atan2(prev.y - v.y, prev.x - v.x);
                    let sweep = normalizeAngleSigned(aEnd - aStart);
                    if (sweep < 0) sweep += Math.PI * 2;

                    // 원래 내각을 나타내는 호: 조각 부채꼴들을 감싸도록 그 바깥에
                    const ringR = state.showTriangleAngles && vertexWedgeR[rel.vertexIdx]
                        ? vertexWedgeR[rel.vertexIdx] + 6 * S : 48 * S;
                    ctx.beginPath();
                    ctx.arc(v.x, v.y, ringR, aStart, aStart + sweep, false);
                    ctx.lineWidth = 5 * S;
                    ctx.strokeStyle = '#312E81';
                    ctx.stroke();

                    // 2) 꼭짓점 바깥쪽에 대형 수식 말풍선 배치 (예: ∠A = 36° + 36° + 36° = 108°)
                    // 조각이 많으면 말풍선이 너무 길어지지 않게 간격을 줄임
                    const sep = rel.pieces.length > 4 ? '+' : ' + ';
                    const formulaText = rel.pieces.length === 1
                        ? `∠${rel.label} = ${rel.totalDeg}°`
                        : `∠${rel.label} = ` + rel.pieces.map(p => `${p.deg}°`).join(sep) + ` = ${rel.totalDeg}°`;

                    ctx.font = monoFont(rel.pieces.length > 4 ? 15 : 17);
                    const txtW = ctx.measureText(formulaText).width;
                    const padX = 14 * S;
                    const boxW = txtW + padX * 2, boxH = 40 * S;

                    const midA = aStart + sweep / 2;
                    const outDist = (w < 640 ? 40 : 70) * S + boxH / 2;
                    let bx = v.x + outDist * Math.cos(midA + Math.PI);
                    let by = v.y + outDist * Math.sin(midA + Math.PI);

                    // 위쪽 안내 카드나 아래 받침대와 겹치면 꼭짓점 옆으로 옮김
                    const ov = getOverlayRects();
                    const minY = ov.topSafe + boxH / 2 + 4;
                    const maxY = (state.gatherLayout === 'TRAY' ? trayLayout(tris.length).topY : h) - boxH / 2 - 4;
                    // 위로 조금만 넘치면, 꼭짓점을 가리지 않는 한 안내 카드 바로 아래에 붙여 둠
                    if (by < minY && minY + boxH / 2 <= v.y - 18 * S) {
                        by = minY;
                    } else if (by < minY || by > maxY) {
                        const polyCx = state.vertices.reduce((s, p) => s + p.x, 0) / n;
                        const side = v.x >= polyCx ? 1 : -1;
                        bx = v.x + side * (boxW / 2 + 40 * S);
                        by = Math.max(minY, Math.min(maxY, v.y));
                        // 옆으로 옮겼는데 화면 밖이면 반대편으로
                        if (bx + boxW / 2 > w - 8 || bx - boxW / 2 < 8) bx = v.x - side * (boxW / 2 + 40 * S);
                    }
                    bx = Math.max(boxW / 2 + 8, Math.min(w - boxW / 2 - 8, bx));

                    // 연결 점선 (꼭짓점 -> 말풍선)
                    ctx.beginPath();
                    ctx.moveTo(v.x, v.y);
                    ctx.lineTo(bx, by);
                    ctx.lineWidth = 2 * S;
                    ctx.strokeStyle = '#6366F1';
                    ctx.setLineDash([4 * S, 4 * S]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 말풍선 카드 박스
                    ctx.shadowColor = 'rgba(15, 23, 42, 0.25)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 4;
                    ctx.beginPath();
                    ctx.roundRect(bx - boxW / 2, by - boxH / 2, boxW, boxH, 10 * S);
                    ctx.fillStyle = '#0F172A';
                    ctx.fill();
                    ctx.lineWidth = 2.5 * S;
                    ctx.strokeStyle = '#6366F1';
                    ctx.stroke();
                    ctx.shadowColor = 'transparent';

                    // 각도 텍스트를 삼각형 조각별 고유 색상으로 칠판처럼 렌더링
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    let curX = bx - txtW / 2;
                    
                    ctx.fillStyle = '#F8FAFC';
                    ctx.fillText(`∠${rel.label} = `, curX, by);
                    curX += ctx.measureText(`∠${rel.label} = `).width;

                    if (rel.pieces.length === 1) {
                        ctx.fillStyle = '#FBBF24';
                        ctx.fillText(`${rel.totalDeg}°`, curX, by);
                    } else {
                        rel.pieces.forEach((p, idx) => {
                            ctx.fillStyle = p.palette.hex;
                            ctx.fillText(`${p.deg}°`, curX, by);
                            curX += ctx.measureText(`${p.deg}°`).width;

                            if (idx < rel.pieces.length - 1) {
                                ctx.fillStyle = '#94A3B8';
                                ctx.fillText(sep, curX, by);
                                curX += ctx.measureText(sep).width;
                            }
                        });
                        ctx.fillStyle = '#F8FAFC';
                        ctx.fillText(' = ', curX, by);
                        curX += ctx.measureText(' = ').width;
                        ctx.fillStyle = '#FBBF24';
                        ctx.fillText(`${rel.totalDeg}°`, curX, by);
                    }

                    ctx.restore();
                }
            }

            // 6. Polygon Vertices Handles (A, B, C...)
            state.vertices.forEach((v, idx) => {
                const isFocused = idx === state.focusedVertexIdx;
                const isHovered = idx === state.hoveredVertexIndex;
                const isManualPick = state.triMode === 'MANUAL' && idx === state.manualSelectedVertex;
                const r = (isFocused || isManualPick ? 16 : 13) * S;

                ctx.save();
                // 오목한 꼭짓점(내각 > 180°)은 주황색 점선 고리로 표시
                if (state.allowConcave && isReflexVertex(state.vertices, idx)) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(v.x, v.y, 30 * S, 0, Math.PI * 2);
                    ctx.lineWidth = 3 * S;
                    ctx.setLineDash([5 * S, 4 * S]);
                    ctx.strokeStyle = '#EA580C';
                    ctx.stroke();
                    ctx.restore();
                }
                if (isFocused || isManualPick) {
                    ctx.beginPath();
                    ctx.arc(v.x, v.y, 24 * S, 0, Math.PI * 2);
                    ctx.fillStyle = isManualPick ? 'rgba(234, 88, 12, 0.3)' : 'rgba(79, 70, 229, 0.25)';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(v.x, v.y, r, 0, Math.PI * 2);
                ctx.fillStyle = isManualPick ? '#EA580C' : (isFocused ? '#4F46E5' : '#FFFFFF');
                ctx.fill();
                ctx.lineWidth = 3 * S;
                ctx.strokeStyle = isManualPick ? '#9A3412' : (isFocused ? '#3730A3' : '#0F172A');
                ctx.stroke();

                ctx.font = monoFont(13);
                ctx.fillStyle = (isFocused || isManualPick) ? '#FFFFFF' : '#0F172A';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(VERTEX_LETTERS[idx], v.x, v.y + 0.5);
                ctx.restore();
            });

            // 7. Center Point P (Mode C)
            if (state.triMode === 'CENTER') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(state.centerPoint.x, state.centerPoint.y, 14 * S, 0, Math.PI * 2);
                ctx.fillStyle = '#E11D48';
                ctx.fill();
                ctx.lineWidth = 3 * S;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();

                ctx.font = monoFont(12);
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P', state.centerPoint.x, state.centerPoint.y + 0.5);
                ctx.restore();
            }
        }

        function drawTriangulationLines() {
            const n = state.vertices.length;
            ctx.save();
            ctx.setLineDash([7 * S, 5 * S]);
            ctx.lineWidth = 2.5 * S;
            ctx.strokeStyle = '#334155';

            // 다각형 밖으로 나가는 선은 빨간색 굵은 선으로 표시
            const drawSeg = (p, q, bad) => {
                ctx.save();
                if (bad) {
                    ctx.strokeStyle = '#E11D48';
                    ctx.lineWidth = 4 * S;
                    ctx.setLineDash([10 * S, 6 * S]);
                }
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
                ctx.restore();
            };

            if (state.triMode === 'VERTEX') {
                const b = state.baseVertexIndex;
                const bad = getInvalidFanTargets();
                for (let k = 2; k < n - 1; k++) {
                    const target = (b + k) % n;
                    drawSeg(state.vertices[b], state.vertices[target], bad.includes(target));
                }
            } else if (state.triMode === 'MANUAL') {
                state.manualDiagonals.forEach(([a, b]) => {
                    ctx.beginPath();
                    ctx.moveTo(state.vertices[a].x, state.vertices[a].y);
                    ctx.lineTo(state.vertices[b].x, state.vertices[b].y);
                    ctx.stroke();
                });
            } else if (state.triMode === 'CENTER') {
                const bad = getInvalidCenterTargets();
                for (let i = 0; i < n; i++) {
                    drawSeg(state.centerPoint, state.vertices[i], bad.includes(i));
                }
            }
            ctx.restore();
        }

        function drawCrispBadge(x, y, text, textColor, bgColor, borderColor, fontSize, alpha) {
            if (alpha <= 0.05) return;
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.font = `800 ${Math.round(fontSize)}px "JetBrains Mono", Consolas, monospace`;
            const textW = ctx.measureText(text).width;
            const pw = textW + 14 * S;
            const ph = fontSize + 10 * S;

            ctx.shadowColor = 'rgba(15, 23, 42, 0.12)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;

            ctx.beginPath();
            ctx.roundRect(x - pw / 2, y - ph / 2, pw, ph, 8);
            ctx.fillStyle = bgColor;
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.lineWidth = 1.8 * S;
            ctx.strokeStyle = borderColor;
            ctx.stroke();

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y + 1);
            ctx.restore();
        }

        // ============================================================================
        // 9. 공용 창 (규칙 찾기 · 확인 문제)
        // ============================================================================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-backdrop').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }
        window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        function showOnCanvas(n, mode) {
            closeModal();
            if (n < MIN_SIDES || n > MAX_SIDES) return;
            setTriMode(mode || 'VERTEX');
            setPolygonSides(n);
        }

        // ---------------------------------------------------------------------------
        // 9-1. 규칙 찾기 표: 칸을 눌러 하나씩 공개하며 규칙을 찾아감
        // ---------------------------------------------------------------------------
        const RULE_ROWS = [3, 4, 5, 6, 7, 8, 9, 10, 'n'];
        const RULE_COLS = [
            { title: '한 꼭짓점에서 그은<br>대각선의 수', val: n => n === 'n' ? 'n − 3' : `${n - 3}` },
            { title: '나누어진<br>삼각형의 수', val: n => n === 'n' ? 'n − 2' : `${n - 2}` },
            { title: '내각의 크기의 합', val: n => n === 'n' ? '180° × (n − 2)' : `180° × ${n - 2} = ${180 * (n - 2)}°` },
            { title: '정다각형의<br>한 내각의 크기', val: n => {
                if (n === 'n') return '180° × (n − 2) ÷ n';
                const v = 180 * (n - 2) / n;
                return Number.isInteger(v) ? `${v}°` : `약 ${v.toFixed(1)}°`;
            } }
        ];
        const ruleRevealed = new Set();

        function ruleTableHtml() {
            const head = `<tr>
                <th class="p-3 text-left text-lg font-extrabold text-slate-700 whitespace-nowrap">다각형</th>
                ${RULE_COLS.map(c => `<th class="p-3 text-center text-base font-extrabold text-slate-700 leading-snug">${c.title}</th>`).join('')}
            </tr>`;
            const rows = RULE_ROWS.map((n, r) => {
                const isGeneral = n === 'n';
                const name = isGeneral ? 'n각형' : polyName(n);
                const nameCell = isGeneral
                    ? `<td class="p-2"><span class="whitespace-nowrap text-xl font-extrabold text-emerald-700">${name}</span></td>`
                    : `<td class="p-2"><button onclick="showOnCanvas(${n})" title="그림으로 보기" class="whitespace-nowrap text-xl font-extrabold text-slate-900 hover:text-blue-700 underline decoration-dotted decoration-2 underline-offset-4">${name}</button></td>`;
                const cells = RULE_COLS.map((c, ci) => {
                    const key = `${r},${ci}`;
                    const shown = ruleRevealed.has(key);
                    return `<td class="p-1"><div onclick="toggleRuleCell('${key}')" class="rule-cell ${shown ? '' : 'hidden-val'} rounded-lg px-2 py-1.5 text-center text-xl font-extrabold font-mono-num ${isGeneral ? 'text-emerald-700' : 'text-slate-900'}">${shown ? c.val(n) : '?'}</div></td>`;
                }).join('');
                return `<tr class="${isGeneral ? 'border-t-4 border-emerald-500 bg-emerald-50/60' : 'border-t border-slate-200'}">${nameCell}${cells}</tr>`;
            }).join('');
            return `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <p class="text-lg text-slate-600 font-semibold">칸을 누르면 값이 나타나요. 다각형 이름을 누르면 그림으로 볼 수 있어요.</p>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="revealNextRuleRow()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-lg font-extrabold">다음 줄 공개</button>
                        <button onclick="setAllRule(true)" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 text-slate-700 text-lg font-bold hover:bg-slate-50">모두 공개</button>
                        <button onclick="setAllRule(false)" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 text-slate-700 text-lg font-bold hover:bg-slate-50">모두 가리기</button>
                    </div>
                </div>
                <div class="overflow-x-auto -mx-1 px-1"><table class="w-full min-w-[40rem] border-collapse">${head}${rows}</table></div>
`;
        }
        function refreshRuleTable() {
            document.getElementById('modal-body').innerHTML = ruleTableHtml();
        }
        function openRuleModal() {
            openModal('규칙 찾기: n각형의 내각의 크기의 합', ruleTableHtml());
        }
        function toggleRuleCell(key) {
            if (ruleRevealed.has(key)) ruleRevealed.delete(key); else ruleRevealed.add(key);
            refreshRuleTable();
        }
        function revealNextRuleRow() {
            for (let r = 0; r < RULE_ROWS.length; r++) {
                const keys = RULE_COLS.map((_, c) => `${r},${c}`);
                if (keys.some(k => !ruleRevealed.has(k))) {
                    keys.forEach(k => ruleRevealed.add(k));
                    break;
                }
            }
            refreshRuleTable();
        }
        function setAllRule(show) {
            ruleRevealed.clear();
            if (show) RULE_ROWS.forEach((_, r) => RULE_COLS.forEach((_, c) => ruleRevealed.add(`${r},${c}`)));
            refreshRuleTable();
        }

        // ---------------------------------------------------------------------------
        // 9-2. 확인 문제: 매번 새로 만들어지는 4지선다
        // ---------------------------------------------------------------------------
        const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }
        function makeChoices(answer, candidates) {
            const wrong = [...new Set(candidates)].filter(c => c !== answer);
            return shuffle([answer, ...shuffle(wrong).slice(0, 3)]);
        }

        const QUIZ_TYPES = [
            // 내각의 크기의 합 구하기
            () => {
                const n = randInt(5, 15), ans = 180 * (n - 2);
                return {
                    q: `${polyName(n)}의 내각의 크기의 합은?`,
                    answer: `${ans}°`,
                    choices: makeChoices(`${ans}°`, [180 * (n - 1), 180 * (n - 3), 180 * n, 180 * (n - 2) + 360].map(v => `${v}°`)),
                    explain: `${polyName(n)}은 한 꼭짓점에서 대각선을 그으면 삼각형 ${n - 2}개로 나뉘어요.<br>180° × (${n} − 2) = ${ans}°`,
                    n
                };
            },
            // 내각의 크기의 합으로 다각형 찾기
            () => {
                const n = randInt(5, 14), s = 180 * (n - 2);
                return {
                    q: `내각의 크기의 합이 ${s}°인 다각형은?`,
                    answer: polyName(n),
                    choices: makeChoices(polyName(n), [n - 2, n - 1, n + 1, n + 2].filter(k => k >= 3).map(polyName)),
                    explain: `180° × (n − 2) = ${s}° 이므로 n − 2 = ${n - 2}, n = ${n}`,
                    n
                };
            },
            // 정다각형의 한 내각
            () => {
                const list = [5, 6, 8, 9, 10, 12, 15, 18, 20];
                const n = pick(list), val = 180 * (n - 2) / n;
                const near = list.filter(k => k !== n).sort((a, b) => Math.abs(a - n) - Math.abs(b - n)).slice(0, 3).map(k => `${180 * (k - 2) / k}°`);
                return {
                    q: `정${polyName(n)}의 한 내각의 크기는?`,
                    answer: `${val}°`,
                    choices: makeChoices(`${val}°`, [`${360 / n}°`, ...near]),
                    explain: `내각의 크기의 합은 180° × (${n} − 2) = ${180 * (n - 2)}°이고, 정다각형은 ${n}개의 내각의 크기가 모두 같아요.<br>${180 * (n - 2)}° ÷ ${n} = ${val}°`,
                    n
                };
            },
            // 한 꼭짓점에서 나눈 삼각형의 수
            () => {
                const n = randInt(5, 15);
                return {
                    q: `${polyName(n)}의 한 꼭짓점에서 대각선을 모두 그으면 삼각형은 몇 개 생길까?`,
                    answer: `${n - 2}개`,
                    choices: makeChoices(`${n - 2}개`, [`${n - 3}개`, `${n - 1}개`, `${n}개`]),
                    explain: `한 꼭짓점에서 그을 수 있는 대각선은 ${n - 3}개이고, 이 대각선으로 삼각형 ${n - 2}개가 생겨요.`,
                    n
                };
            },
            // 내부의 한 점으로 나누는 방법
            () => {
                const n = randInt(5, 12);
                return {
                    q: `${polyName(n)}의 내부의 한 점과 각 꼭짓점을 이어 삼각형 ${n}개로 나누었어요. 내각의 크기의 합을 구하는 식은?`,
                    answer: `180° × ${n} − 360°`,
                    choices: makeChoices(`180° × ${n} − 360°`, [`180° × ${n}`, `180° × ${n} − 180°`, `180° × ${n} + 360°`]),
                    explain: `삼각형 ${n}개의 내각의 합 180° × ${n}에서 내부의 점 주위에 모인 360°를 빼야 해요.<br>180° × ${n} − 360° = ${180 * n - 360}°`,
                    n, mode: 'CENTER'
                };
            }
        ];

        const quiz = { score: 0, total: 0, current: null, lastType: -1, answered: false };

        function newQuizQuestion() {
            let t;
            do { t = randInt(0, QUIZ_TYPES.length - 1); } while (t === quiz.lastType);
            quiz.lastType = t;
            quiz.current = QUIZ_TYPES[t]();
            quiz.answered = false;
            renderQuiz();
        }

        function renderQuiz(chosen) {
            const c = quiz.current;
            const choiceBtns = c.choices.map((ch, i) => {
                let cls = 'border-slate-300 bg-white hover:bg-slate-50 text-slate-900';
                if (quiz.answered) {
                    if (ch === c.answer) cls = 'border-emerald-500 bg-emerald-50 text-emerald-800';
                    else if (ch === chosen) cls = 'border-rose-500 bg-rose-50 text-rose-700';
                    else cls = 'border-slate-200 bg-white text-slate-400';
                }
                return `<button ${quiz.answered ? 'disabled' : ''} onclick="answerQuiz(${i})"
                    class="choice-btn px-3 md:px-4 py-4 md:py-5 rounded-2xl border-[3px] text-xl md:text-2xl font-extrabold font-mono-num ${cls}">
                    <span class="text-slate-400 mr-2">${'①②③④'[i]}</span>${ch}</button>`;
            }).join('');

            let feedback = '';
            if (quiz.answered) {
                const ok = chosen === c.answer;
                feedback = `
                    <div class="mt-5 rounded-2xl p-5 ${ok ? 'bg-emerald-50 border-2 border-emerald-300' : 'bg-rose-50 border-2 border-rose-300'}">
                        <div class="text-2xl font-extrabold ${ok ? 'text-emerald-700' : 'text-rose-700'} mb-2">${ok ? '정답이에요!' : `아쉬워요. 정답은 ${c.answer}`}</div>
                        <div class="text-xl font-semibold text-slate-800 leading-relaxed font-mono-num">${c.explain}</div>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 mt-4">
                        ${c.n <= MAX_SIDES ? `<button onclick="showOnCanvas(${c.n}, '${c.mode || 'VERTEX'}')" class="px-4 py-3 rounded-xl border-2 border-slate-300 text-slate-700 text-lg font-bold hover:bg-slate-50">그림으로 확인</button>` : ''}
                        <button onclick="newQuizQuestion()" class="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-lg font-extrabold flex items-center gap-2">다음 문제 <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
                    </div>`;
            }

            openModal('확인 문제', `
                <div class="flex items-center justify-between mb-4">
                    <span class="text-lg font-bold text-slate-500">문제 ${quiz.total + (quiz.answered ? 0 : 1)}</span>
                    <span class="text-lg font-extrabold text-slate-700">맞힌 문제 <span class="text-amber-600">${quiz.score}</span> / ${quiz.total}</span>
                </div>
                <p class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug mb-6">${c.q}</p>
                <div class="grid grid-cols-2 gap-3">${choiceBtns}</div>
                ${feedback}`);
        }

        function answerQuiz(i) {
            if (quiz.answered) return;
            const chosen = quiz.current.choices[i];
            quiz.answered = true;
            quiz.total++;
            if (chosen === quiz.current.answer) quiz.score++;
            renderQuiz(chosen);
        }

        // 사용법 안내 (처음 써 보는 사람용)
        function openHelp() {
            const step = (n, title, body) => `
                <li class="flex gap-3">
                    <span class="w-8 h-8 rounded-full bg-slate-900 text-white font-extrabold flex items-center justify-center shrink-0 font-mono-num">${n}</span>
                    <div class="min-w-0">
                        <div class="text-lg font-extrabold text-slate-900">${title}</div>
                        <div class="text-base font-semibold text-slate-600 leading-relaxed">${body}</div>
                    </div>
                </li>`;
            openModal('사용법', `
                <p class="text-lg font-semibold text-slate-700 mb-5">다각형을 삼각형으로 나누면 내각의 크기의 합을 어떻게 구할 수 있을까요?</p>
                <ol class="space-y-4 mb-6">
                    ${step(1, '다각형 고르기', '위쪽 − / + 로 삼각형부터 십이각형까지 바꿔요. 꼭짓점을 끌면 모양이 바뀌고, <b>정다각형으로</b>를 누르면 처음 모양으로 돌아가요.')}
                    ${step(2, '삼각형으로 나누기', '<b>한 꼭짓점에서</b>, <b>대각선 직접</b>, <b>내부의 한 점</b> 중 나누는 방법을 골라요. 대각선 직접은 두 꼭짓점을 차례로 눌러 대각선을 그어요.')}
                    ${step(3, '꼭짓점의 각 살펴보기', '꼭짓점을 누르면 그 내각이 어떤 삼각형 조각들로 나뉘는지 말풍선으로 보여 줘요. 예: ∠A = 36° + 36° + 36° = 108°')}
                    ${step(4, '세 각을 모아 180°', '<b>조각 1개씩 모으기</b>나 <b>한 번에</b>를 누르면 각 삼각형의 세 각이 모여 180°의 반원이 돼요.')}
                    ${step(5, '규칙 찾기와 확인 문제', '<b>규칙 찾기</b> 표의 칸을 하나씩 열며 180° × (n − 2)를 찾고, <b>확인 문제</b>로 마무리해요.')}
                    ${step(6, '오목다각형', '<b>오목다각형</b> 스위치를 켜면 꼭짓점 하나가 들어간 모양이 돼요. 꼭짓점에 따라 대각선이 밖으로 나가는 경우를 빨간 선으로 보여 줘요.')}
                </ol>
                <div class="text-sm font-semibold text-slate-500">각도 보기 메뉴에서 나뉜 각, 수식 말풍선, 다각형의 내각 숫자를 따로 켜고 끌 수 있어요.</div>`);
        }

        function openQuiz() {
            if (!quiz.current || quiz.answered) newQuizQuestion();
            else renderQuiz();
        }

        window.onload = function () {
            try {
                const saved = localStorage.getItem('polygonLab.boardMode');
                // 저장된 설정이 없으면 큰 화면(전자칠판·대형 모니터)에서만 칠판 모드로 시작
                state.boardMode = saved !== null ? saved === '1' : window.innerWidth >= 1280;
            } catch (e) {}
            applyBoardMode();
            renderConcaveSwitch();
            renderViewMenu();
            resizeCanvas();
            setPolygonSides(state.numSides);
            requestAnimationFrame(animateLoop);
        };
    </script>
</div>
</body>
</html>
